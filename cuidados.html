<title>Guia de Cuidados</title>

<meta name="description" content="Como cuidar do seu procedimento, dia a dia, até a cicatrização completa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16130F;--ink-2:#221C15;--bone:#F6F2EA;--bone-2:#EFE8DA;
    --paper-line:rgba(20,16,12,.09);--brass:#C39B4E;--brass-deep:#93712C;
    --ash:#6C6156;--char:#2A2119;--alert:#B24230;--alert-bg:#F7E7E2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Newsreader",Georgia,serif;background:var(--bone);color:var(--char);line-height:1.55;font-size:17px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto}
  .eyebrow{font-family:"Cinzel",serif;letter-spacing:.32em;text-transform:uppercase;font-size:11px;font-weight:600;}

  /* HERO */
  .hero{background:var(--ink);color:var(--bone);position:relative;overflow:hidden;padding:56px 26px 60px;}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 78% -10%, rgba(195,155,78,.22), transparent 55%);pointer-events:none;}
  .hero .wrap{position:relative}
  .hero .eyebrow{color:var(--brass);opacity:.9}
  .studio{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(22px,6vw,30px);letter-spacing:.06em;text-transform:uppercase;color:#fff;margin:16px 0 30px;line-height:1.15;}
  .greet{font-size:clamp(30px,9vw,42px);font-weight:500;line-height:1.05;letter-spacing:-.01em;}
  .greet b{color:var(--brass);font-weight:600}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
  .chip{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;border:1px solid rgba(246,242,234,.24);color:rgba(246,242,234,.85);padding:7px 12px;border-radius:2px;}

  /* INTRO */
  .note{padding:34px 26px 8px;}
  .note p{font-style:italic;font-size:19px;color:var(--ash);line-height:1.6;}

  /* TIMELINE */
  .stages{padding:26px 26px 6px}
  .stages-head{margin-bottom:8px}
  .stages-head .eyebrow{color:var(--brass-deep)}
  .stages-head h2{font-weight:500;font-size:26px;margin-top:8px;letter-spacing:-.01em;}
  .rail{position:relative;padding-left:34px;margin-top:26px}
  .rail::before{content:"";position:absolute;left:9px;top:6px;bottom:26px;width:2px;background:linear-gradient(var(--brass),rgba(195,155,78,.25));}
  .stage{position:relative;padding:0 0 30px;opacity:1;}
  .stage .dot{position:absolute;left:-34px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--bone);border:2px solid var(--brass);display:grid;place-items:center;}
  .stage .dot span{width:7px;height:7px;border-radius:50%;background:var(--brass)}
  .days{font-family:"Cinzel",serif;font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-deep);}
  .stage h3{font-weight:600;font-size:20px;margin:2px 0 12px;color:var(--char);}
  .stage ul{list-style:none}
  .stage li{position:relative;padding:5px 0 5px 26px;color:var(--char);font-size:16.5px;line-height:1.45;}
  .stage li svg{position:absolute;left:0;top:9px;width:15px;height:15px}
  .stage li b{font-weight:600}
  .reveal .stage{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .reveal .stage.in{opacity:1;transform:none}

  /* ALERT */
  .alert{margin:12px 26px 8px;background:var(--alert-bg);border:1px solid rgba(178,66,48,.22);border-radius:4px;padding:22px 22px 20px;}
  .alert .eyebrow{color:var(--alert)}
  .alert h3{color:var(--alert);font-weight:600;font-size:19px;margin:8px 0 12px}
  .alert ul{list-style:none}
  .alert li{position:relative;padding:4px 0 4px 22px;font-size:16px;color:#6a2f24}
  .alert li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--alert)}
  .alert .close{margin-top:14px;font-size:15.5px;color:#6a2f24;font-style:italic}

  /* CTA */
  .cta{padding:30px 26px 20px}
  .cta-eye{text-align:center;margin-bottom:18px}
  .cta-eye .eyebrow{color:var(--brass-deep)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:4px;font-family:"Cinzel",serif;font-weight:600;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;margin-bottom:12px;border:1.5px solid transparent;cursor:pointer;transition:transform .15s ease,background .2s ease;}
  .btn:active{transform:scale(.985)}
  .btn-gold{background:var(--brass);color:var(--ink)}
  .btn-gold:hover{background:#d0a95d}
  .btn-line{background:transparent;border-color:var(--char);color:var(--char)}
  .btn-line:hover{background:rgba(42,33,25,.05)}
  .btn svg{width:18px;height:18px}
  .review-nudge{text-align:center;font-style:italic;color:var(--ash);font-size:15px;line-height:1.55;margin:2px 4px 16px;}
  .hide{display:none !important}

  /* FOOTER */
  footer{background:var(--ink);color:rgba(246,242,234,.7);padding:34px 26px 40px;margin-top:24px;text-align:center;}
  footer .fstudio{font-family:"Cinzel",serif;color:#fff;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
  footer .flinks{margin-top:12px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  footer a{color:var(--brass);text-decoration:none;font-size:15px}
  footer .credit{margin-top:26px;font-size:12px;opacity:.55;letter-spacing:.04em}
  footer .credit a{color:rgba(246,242,234,.75)}

  @media (max-width:420px){
    .hero{padding:44px 20px 48px}
    .note,.stages,.cta{padding-left:20px;padding-right:20px}
    .alert{margin-left:20px;margin-right:20px}
    body{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .reveal .stage{opacity:1;transform:none;transition:none}
    .btn{transition:none}
  }
</style>
</head>

  /* ─────────────────────────────────────────────
     RESOLUÇÃO: procedimento + idioma
  ───────────────────────────────────────────── */
  function normTipo(t){
    var s=(t||"").toLowerCase();
    if(s.indexOf("pierc")>-1) return "Piercing";
    if(s.indexOf("are")>-1 || s.indexOf("aré")>-1 || s.indexOf("areo")>-1) return "Aréola";
    return "Tatuagem";
  }
  function normLang(l){
    var s=(l||"").slice(0,2).toLowerCase();
    return (s==="pt"||s==="en"||s==="es") ? s : "";
  }
  var tipo = normTipo(g("tipo"));
  // idioma: 1) parâmetro do link  2) idioma do navegador (cliente estrangeiro)  3) pt
  var lang = normLang(g("lang")) || normLang(navigator.language) || "pt";
  var U = UI[lang] || UI.pt;

  // base do conteúdo (padrão) + merge do texto editado pelo tatuador (?d=)
  function deepGuide(t,l){ var b=(GUIAS[t]&&GUIAS[t][l])||(GUIAS[t]&&GUIAS[t].pt)||GUIAS.Tatuagem.pt; return JSON.parse(JSON.stringify(b)); }
  var guia = deepGuide(tipo,lang);

  function b64uDecode(s){
    try{ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="="; return decodeURIComponent(escape(atob(s))); }
    catch(e){ return ""; }
  }
  var dRaw = g("d");
  if(dRaw){
    try{
      var ov = JSON.parse(b64uDecode(dRaw));
      if(ov && typeof ov==="object"){
        if(typeof ov.note==="string") guia.note = ov.note;
        if(Array.isArray(ov.stages) && ov.stages.length) guia.stages = ov.stages;
        if(ov.alert && typeof ov.alert==="object"){
          if(typeof ov.alert.title==="string") guia.alert.title = ov.alert.title;
          if(Array.isArray(ov.alert.items) && ov.alert.items.length) guia.alert.items = ov.alert.items;
          if(typeof ov.alert.close==="string") guia.alert.close = ov.alert.close;
        }
      }
    }catch(e){ /* usa padrão */ }
  }

  /* ─────────────────────────────────────────────
     DADOS DO ESTÚDIO / CLIENTE (via link)
  ───────────────────────────────────────────── */
  var estudio = g("est") || "Seu Estúdio";
  var cliente = g("cli");
  var regiao  = g("reg");
  var data    = g("dt");
  var whats   = g("wa").replace(/\D/g,"");
  var google  = g("g");
  var insta   = g("ig");
  var site    = g("site");
  var nota    = g("nota"); // nota pessoal opcional sobrescreve a introdução

  document.documentElement.lang = (lang==="pt"?"pt-BR":lang);
  document.getElementById("studioName").textContent = estudio;
  document.getElementById("fStudio").textContent = estudio;
  document.title = U.eyebrow + " · " + estudio;

  // chrome i18n
  document.getElementById("eyebrow").textContent = U.eyebrow;
  document.getElementById("journeyEye").textContent = U.journeyEye;
  document.getElementById("journeyH").textContent = U.journeyH;
  document.getElementById("alertEye").textContent = U.alertEye;
  document.getElementById("ctaEye").textContent = U.ctaEye;
  document.getElementById("btnGoogleTxt").textContent = U.btnGoogle;
  document.getElementById("btnPhotoTxt").textContent = U.btnPhoto;
  document.getElementById("btnWhatsTxt").textContent = U.btnWhats;
  document.getElementById("creditTxt").textContent = U.credit;

  // saudação
  document.getElementById("greet").innerHTML = cliente
    ? U.hi.replace("{name}", esc(cliente.split(" ")[0]))
    : (U.done[tipo] || U.done.Tatuagem);

  // introdução (nota personalizada tem prioridade sobre o guia)
  document.getElementById("note").textContent = nota || guia.note;

  // chips: procedimento + região + data
  var chips = [];
  chips.push(U.proc[tipo] || tipo);
  if(regiao) chips.push(regiao);
  if(data)   chips.push(data);
  document.getElementById("meta").innerHTML =
    chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join("");

  /* ─────────────────────────────────────────────
     LINHA DO TEMPO
  ───────────────────────────────────────────── */
  var check = '<svg viewBox="0 0 24 24" fill="none" stroke="#C39B4E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  document.getElementById("rail").innerHTML = guia.stages.map(function(s){
    return '<article class="stage">'
      + '<div class="dot"><span></span></div>'
      + '<div class="days">'+esc(s.days)+'</div>'
      + '<h3>'+esc(s.title)+'</h3><ul>'
      + (s.items||[]).map(function(i){return '<li>'+check+i+'</li>';}).join("")
      + '</ul></article>';
  }).join("");

  // alerta
  document.getElementById("alertH").textContent = guia.alert.title;
  document.getElementById("alertList").innerHTML = (guia.alert.items||[]).map(function(i){return '<li>'+i+'</li>';}).join("");
  document.getElementById("alertClose").textContent = guia.alert.close;

  /* ─────────────────────────────────────────────
     CTAs
  ───────────────────────────────────────────── */
  function waLink(num, text){
    var n = num; if(n && n.length && n[0] !== "5") n = "55" + n; // assume BR
    return "https://wa.me/" + n + (text ? "?text=" + encodeURIComponent(text) : "");
  }
  if(google){
    var bg = document.getElementById("btnGoogle");
    bg.href = google; bg.classList.remove("hide");
    var nudge = document.getElementById("reviewNudge");
    nudge.textContent = U.reviewNudge; nudge.classList.remove("hide");
  }
  if(whats){
    var first = cliente ? cliente.split(" ")[0] : "";
    var who = first ? (first + " — ") : "";
    var bp = document.getElementById("btnPhoto");
    bp.href = waLink(whats, U.waPhoto.replace("{who}", who));
    bp.classList.remove("hide");
    var bw = document.getElementById("btnWhats");
    bw.href = waLink(whats, U.waDoubt);
    bw.classList.remove("hide");
  }

  // footer links
  var fl = [];
  if(insta) fl.push('<a href="https://instagram.com/'+esc(insta.replace(/^@/,""))+'" target="_blank" rel="noopener">@'+esc(insta.replace(/^@/,""))+'</a>');
  if(site)  fl.push('<a href="'+esc(site)+'" target="_blank" rel="noopener">'+U.footerSite+'</a>');
  if(fl.length) document.getElementById("fLinks").innerHTML = fl.join("");

  /* Scroll reveal */
  if(!window.matchMedia || !matchMedia("(prefers-reduced-motion: reduce)").matches){
    if("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
      }, {threshold:.15});
      document.querySelectorAll(".stage").forEach(function(el){ io.observe(el); });
    } else {
      document.querySelectorAll(".stage").forEach(function(el){ el.classList.add("in"); });
    }
  } else {
    document.querySelectorAll(".stage").forEach(function(el){ el.classList.add("in"); });
  }
})();
</script>
