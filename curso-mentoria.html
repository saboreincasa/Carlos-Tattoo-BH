<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentoria VIP 1:1 — Carlos Tattoo BH</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #f5f7fb;
  --white: #ffffff;
  --text: #111827;
  --text-muted: #6b7280;
  --accent: #1a1a2e;
  --gold: #c9973a;
  --gold-light: #f0c04a;
  --border: #e5e7eb;
  --shadow: 0 4px 24px rgba(0,0,0,.07);
  --shadow-lg: 0 8px 48px rgba(0,0,0,.12);
  --radius: 16px;
}

*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0a18;--d1:#0d0d1a;--d2:#1a1a2e;--g1:#f0c04a;--g2:#c9973a;--g3:#a07830;--t1:#e5e7eb;--t2:#d1d5db;--t3:#9ca3af;}
body{font-family:'Poppins', sans-serif;background:var(--bg);color:var(--t1);display:flex;min-height:100vh;}
.sidebar{width:300px;background:rgba(13,13,26,.97);border-right:1px solid rgba(201,151,58,.1);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column;}
.sb-header{padding:20px;border-bottom:1px solid rgba(201,151,58,.1);}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sb-logo img{height:36px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(201,151,58,.4));}
.sb-titulo{font-family:'Poppins', sans-serif;font-size:11px;letter-spacing:2px;color:var(--g2);text-transform:uppercase;line-height:1.4;}
.sb-progress-wrap{margin-top:12px;}
.sb-progress-label{display:flex;justify-content:space-between;font-family:'Poppins', sans-serif;font-size:9px;letter-spacing:1px;color:rgba(201,151,58,.5);text-transform:uppercase;margin-bottom:6px;}
.sb-progress-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.sb-progress-fill{height:100%;background:linear-gradient(90deg,var(--g3),var(--g1));transition:width .5s;}
.sb-modulos{padding:8px 0;flex:1;}
.sb-mod-titulo{font-family:'Poppins', sans-serif;font-size:9px;letter-spacing:3px;color:rgba(201,151,58,.35);text-transform:uppercase;padding:12px 20px 4px;}
.sb-aula{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;transition:.2s;border-left:3px solid transparent;}
.sb-aula:hover{background:rgba(201,151,58,.05);border-left-color:rgba(201,151,58,.3);}
.sb-aula.active{background:rgba(201,151,58,.08);border-left-color:var(--g2);}
.sb-aula.done .sb-aula-nome{color:rgba(201,151,58,.5);}
.sb-aula-num{font-family:'Playfair Display', serif;font-size:10px;color:var(--g2);width:22px;flex-shrink:0;}
.sb-aula-nome{font-size:12px;color:var(--t2);line-height:1.3;flex:1;}
.sb-aula-check{font-size:11px;color:var(--g2);flex-shrink:0;}
.sb-footer{padding:16px 20px;border-top:1px solid rgba(201,151,58,.1);}
.btn-voltar{display:flex;align-items:center;gap:8px;color:rgba(201,151,58,.5);font-family:'Poppins', sans-serif;font-size:10px;letter-spacing:1px;text-decoration:none;transition:.2s;}
.btn-voltar:hover{color:var(--g2);}
.main{margin-left:300px;flex:1;display:flex;flex-direction:column;}
.main-header{background:rgba(13,13,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,151,58,.1);padding:14px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px;}
.mh-titulo{font-family:'Poppins', sans-serif;font-size:13px;color:var(--t1);flex:1;}
.mh-nav{display:flex;gap:8px;flex-shrink:0;}
.btn-nav-a{background:rgba(201,151,58,.1);border:1px solid rgba(201,151,58,.2);color:var(--g2);padding:8px 16px;border-radius:8px;font-family:'Poppins', sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:.2s;}
.btn-nav-a:hover{background:rgba(201,151,58,.2);}
.btn-nav-a:disabled{opacity:.3;cursor:not-allowed;}
.btn-concluir{background:linear-gradient(135deg,var(--g3),var(--g1));color:#1a1a2e;border:none;padding:8px 16px;border-radius:8px;font-family:'Poppins', sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer;font-weight:700;transition:.2s;}
.btn-concluir:hover{transform:translateY(-1px);}
.aula-wrap{flex:1;padding:36px 40px;max-width:900px;}
.aula-tag{font-family:'Poppins', sans-serif;font-size:9px;letter-spacing:4px;color:rgba(201,151,58,.4);text-transform:uppercase;margin-bottom:10px;}
.aula-h1{font-family:'Playfair Display', serif;font-size:clamp(20px,2.8vw,34px);color:#fff;margin-bottom:18px;line-height:1.2;}
.aula-h1 span{color:var(--g1);}
.aula-intro{font-size:15px;color:var(--t2);line-height:1.9;margin-bottom:28px;padding:18px 22px;background:rgba(201,151,58,.05);border-left:4px solid var(--g2);border-radius:0 10px 10px 0;}
h2.ah2{font-family:'Poppins', sans-serif;font-size:17px;color:#fff;font-weight:700;margin:32px 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(201,151,58,.12);display:flex;align-items:center;gap:8px;}
h2.ah2::before{content:'◆';color:var(--g2);font-size:9px;}
h3.ah3{font-family:'Poppins', sans-serif;font-size:14px;color:var(--g2);font-weight:700;margin:20px 0 8px;}
p.ap{font-size:14px;color:var(--t2);line-height:1.9;margin-bottom:14px;}
.passo{background:rgba(255,255,255,.03);border:1px solid rgba(201,151,58,.1);border-radius:12px;padding:20px 22px;margin:12px 0;display:flex;gap:14px;}
.passo-n{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--g3),var(--g2));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display', serif;font-size:12px;color:#fff;flex-shrink:0;font-weight:900;}
.passo-body h4{font-family:'Poppins', sans-serif;font-size:13px;color:#fff;font-weight:700;margin-bottom:6px;}
.passo-body p{font-size:13px;color:var(--t2);line-height:1.8;margin:0;}
.passo-body code{font-family:'Courier New',monospace;background:rgba(201,151,58,.1);padding:2px 7px;border-radius:4px;font-size:12px;color:var(--g1);}
.destaque{background:rgba(201,151,58,.06);border:1px solid rgba(201,151,58,.2);border-radius:10px;padding:16px 20px;margin:16px 0;}
.destaque p{font-size:13px;color:var(--t1);line-height:1.8;margin:0;}
.destaque strong{color:var(--g1);}
.alerta{background:rgba(231,76,60,.05);border:1px solid rgba(231,76,60,.2);border-radius:10px;padding:14px 18px;margin:14px 0;}
.alerta p{font-size:13px;color:#fca5a5;line-height:1.8;margin:0;}
.dica{background:rgba(39,174,96,.05);border:1px solid rgba(39,174,96,.2);border-radius:10px;padding:14px 18px;margin:14px 0;}
.dica p{font-size:13px;color:#86efac;line-height:1.8;margin:0;}
.checklist{list-style:none;margin:12px 0;}
.checklist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--t2);margin-bottom:8px;line-height:1.7;}
.checklist li::before{content:'✓';color:var(--g2);font-weight:700;flex-shrink:0;}
.exemplo{background:rgba(52,152,219,.05);border:1px solid rgba(52,152,219,.2);border-radius:10px;padding:16px 20px;margin:14px 0;}
.exemplo-label{font-family:'Poppins', sans-serif;font-size:9px;letter-spacing:2px;color:rgba(52,152,219,.6);text-transform:uppercase;margin-bottom:8px;}
.exemplo p{font-size:13px;color:#bfdbfe;line-height:1.8;margin:0;font-style:italic;}
.aula-nav-bottom{display:flex;gap:12px;justify-content:space-between;margin-top:44px;padding-top:24px;border-top:1px solid rgba(201,151,58,.1);}
.btn-ant-b{background:rgba(255,255,255,.04);border:1px solid rgba(201,151,58,.15);color:var(--t2);padding:12px 22px;border-radius:10px;font-family:'Poppins', sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:.2s;}
.btn-ant-b:hover{border-color:rgba(201,151,58,.4);color:var(--g2);}
.btn-prox-b{background:linear-gradient(135deg,var(--g3),var(--g1));color:#1a1a2e;padding:12px 24px;border-radius:10px;font-family:'Poppins', sans-serif;font-size:10px;letter-spacing:2px;cursor:pointer;font-weight:700;border:none;transition:.2s;}
.btn-prox-b:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,151,58,.3);}
@media(max-width:900px){.sidebar{width:260px;transform:translateX(-100%);transition:transform .3s;}.sidebar.open{transform:translateX(0);}.main{margin-left:0;}.aula-wrap{padding:20px 16px;}.main-header{padding:12px 16px;}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <img src="imagens/IPJP8350.JPG" alt="Carlos Tattoo BH" onerror="this.style.display='none'">
      <span class="sb-titulo">Mentoria VIP 1:1</span>

    </div>

    <span class="mh-titulo" id="mhTitulo">Carregando...</span>
    <div class="mh-nav">

<script>
const sessao = JSON.parse(sessionStorage.getItem('ct_sessao')||'null');
if(!sessao) window.location.href='acesso.html';
const CURSO_ID = 'curso-mentoria';
const prog = JSON.parse(localStorage.getItem('ct_progresso_'+(sessao?.email||''))||'{}');
let aulaAtual = prog['aula_'+CURSO_ID]||0;

const MODULOS = [
  {mod:'MÓDULO 1 — DIAGNÓSTICO DO SEU NEGÓCIO', aulas:[
    {t:'Bem-vindo à Mentoria VIP', c:`
<div class="aula-tag">Mentoria VIP · Aula 1</div>
<h1 class="aula-h1">Bem-vindo à <span>Mentoria VIP 1:1</span></h1>
<p class="aula-intro">Parabéns por investir no nível mais alto de desenvolvimento profissional. A Mentoria VIP é um processo personalizado de 30 dias onde o Carlos analisa seu negócio especificamente e cria um plano de ação exclusivo para a sua realidade.</p>
<h2 class="ah2">O que está incluso na sua Mentoria</h2>
<ul class="checklist">
  <li>2 horas de mentoria individual com Carlos via videochamada</li>
  <li>Análise completa do seu perfil do Instagram</li>
  <li>Revisão da sua precificação e posicionamento atual</li>
  <li>Plano de ação personalizado para os próximos 90 dias</li>
  <li>Suporte por WhatsApp por 30 dias após a sessão</li>
  <li>Acesso a todos os cursos e ebooks (Instagram, Tráfego, Posicionamento)</li>
</ul>
<h2 class="ah2">Como funciona o processo</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Preencha o questionário de diagnóstico</h4><p>Nas próximas aulas você vai responder perguntas sobre seu negócio. Seja honesto — isso é confidencial e serve para Carlos chegar preparado na sessão.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Agende a sessão de 2h</h4><p>Após preencher o diagnóstico, envie para Carlos via WhatsApp: (31) 98339-1576 com o assunto "Mentoria VIP — [seu nome]". Você receberá os horários disponíveis.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Execute o plano de ação</h4><p>Durante 30 dias após a sessão, você pode tirar dúvidas diretamente com Carlos pelo WhatsApp para garantir que está no caminho certo.</p></div></div>
<div class="dica"><p>✅ <strong>Dica:</strong> Antes da sessão, prepare: fotos dos seus 10 melhores trabalhos, seu preço médio atual, quanto fatura por mês e qual é seu maior desafio hoje.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)" disabled>← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Diagnóstico — seu negócio hoje', c:`
<div class="aula-tag">Mentoria VIP · Aula 2</div>
<h1 class="aula-h1">Diagnóstico — <span>seu negócio hoje</span></h1>
<p class="aula-intro">Responda as perguntas abaixo com máxima honestidade. Essas respostas são a base do plano de ação que Carlos vai criar especificamente para você.</p>
<h2 class="ah2">Diagnóstico Financeiro</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Quanto você fatura por mês hoje?</h4><p>Considere tudo: tatuagens, retoques, materiais. Anote o valor médio dos últimos 3 meses.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Qual é o seu ticket médio por tatuagem?</h4><p>Divida o faturamento pelo número de sessões. Exemplo: R$5.000 ÷ 15 sessões = R$333 ticket médio.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Quais são seus maiores custos?</h4><p>Liste: aluguel, materiais, ferramentas, plataformas, marketing. Some tudo.</p></div></div>
<h2 class="ah2">Diagnóstico de Posicionamento</h2>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Qual é o seu estilo principal?</h4><p>O que você faz melhor e mais? É isso que deve aparecer em destaque no seu marketing.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Quem é seu cliente ideal?</h4><p>Pense: faixa etária, gênero, poder aquisitivo, tipo de tatuagem. Descreva a pessoa que seria seu cliente perfeito.</p></div></div>
<div class="passo"><div class="passo-n">6</div><div class="passo-body"><h4>Qual é seu maior obstáculo hoje?</h4><p>Poucos clientes? Clientes que não pagam bem? Dificuldade para cobrar mais? Falta de tempo? Seja específico.</p></div></div>
<div class="destaque"><p><strong>Próximo passo:</strong> Anote todas as respostas em um documento ou no bloco de notas. Envie para Carlos via WhatsApp (31) 98339-1576 antes da sessão de mentoria.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`}
  ]},
  {mod:'MÓDULO 2 — ANÁLISE DO INSTAGRAM', aulas:[
    {t:'Auditoria completa do seu perfil', c:`
<div class="aula-tag">Mentoria VIP · Aula 3</div>
<h1 class="aula-h1">Auditoria Completa <span>do seu Perfil</span></h1>
<p class="aula-intro">Antes da sessão com Carlos, faça essa auditoria do seu próprio perfil. Isso vai te dar clareza do que está funcionando e do que precisa mudar — e vai maximizar o aproveitamento das 2h com o Carlos.</p>
<h2 class="ah2">Checklist de auditoria</h2>
<h3 class="ah3">Perfil</h3>
<ul class="checklist">
  <li>Foto de perfil: profissional e legível em tamanho pequeno?</li>
  <li>Nome de exibição: tem palavras-chave como "tatuador" e cidade?</li>
  <li>Bio: clara, com especialidade, localização e CTA?</li>
  <li>Link na bio: funciona e leva para WhatsApp ou site?</li>
  <li>Destaques: existem? Têm capas profissionais?</li>
</ul>
<h3 class="ah3">Conteúdo</h3>
<ul class="checklist">
  <li>Últimos 9 posts: são todos de qualidade ou há posts fracos?</li>
  <li>Tem variedade de formatos (foto, carrossel, Reel)?</li>
  <li>Frequência: posta com regularidade ou vai semanas sem postar?</li>
  <li>Legendas: têm CTA claro ou são apenas descritivas?</li>
  <li>Engajamento: comentários e salvamentos ou só curtidas?</li>
</ul>
<h3 class="ah3">Números (verificar nos Insights)</h3>
<ul class="checklist">
  <li>Alcance médio dos últimos 30 dias</li>
  <li>Taxa de engajamento (acima de 3% é bom)</li>
  <li>Cliques no link da bio por mês</li>
  <li>Posts com melhor e pior performance</li>
</ul>
<div class="destaque"><p><strong>Após a auditoria:</strong> Tire prints dos dados dos Insights e envie para Carlos junto com o diagnóstico financeiro. Isso permite que ele chegue na sessão com análise já preparada.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`}
  ]},
  {mod:'MÓDULO 3 — SEU PLANO PERSONALIZADO', aulas:[
    {t:'Estrutura da sessão de 2 horas', c:`
<div class="aula-tag">Mentoria VIP · Aula 4</div>
<h1 class="aula-h1">Estrutura da Sessão <span>de 2 Horas</span></h1>
<p class="aula-intro">Aqui está exatamente o que vai acontecer durante as 2 horas da sessão com Carlos. Saber isso vai te ajudar a aproveitá-la ao máximo.</p>
<h2 class="ah2">Hora 1 — Diagnóstico e Análise (60 minutos)</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>0-15 min: Revisão do diagnóstico</h4><p>Carlos vai revisar o que você enviou antes. Esclarecimentos rápidos sobre o negócio atual.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>15-35 min: Análise do Instagram ao vivo</h4><p>Carlos vai abrir seu perfil durante a chamada e analisar ponto a ponto. Tome nota de cada observação.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>35-60 min: Análise de precificação</h4><p>Baseado no mercado de BH e no seu posicionamento atual, Carlos vai sugerir uma nova estratégia de preços.</p></div></div>
<h2 class="ah2">Hora 2 — Plano de Ação (60 minutos)</h2>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>60-80 min: Estratégia de conteúdo personalizada</h4><p>Carlos vai sugerir tipos específicos de conteúdo para o seu estilo e público. Com exemplos reais.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>80-100 min: Estratégia de aquisição</h4><p>Orgânico, tráfego pago ou os dois? Carlos vai recomendar baseado no seu orçamento e objetivo.</p></div></div>
<div class="passo"><div class="passo-n">6</div><div class="passo-body"><h4>100-120 min: Plano de ação 90 dias</h4><p>Lista priorizada de ações com prazo. O que fazer na semana 1, semana 2, mês 2 e mês 3.</p></div></div>
<div class="dica"><p>✅ <strong>Dica:</strong> Grave a sessão (com permissão) para poder revisar depois. Muita informação vai ser passada e é difícil anotar tudo em tempo real.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Suporte 30 dias e próximos passos', c:`
<div class="aula-tag">Mentoria VIP · Aula 5 — Final</div>
<h1 class="aula-h1">Suporte 30 Dias e <span>Próximos Passos</span></h1>
<p class="aula-intro">A sessão é o começo. Os próximos 30 dias de suporte são onde a transformação realmente acontece. Aqui está como aproveitar ao máximo esse período.</p>
<h2 class="ah2">Como usar o suporte de 30 dias</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Execute uma ação por dia</h4><p>Não tente fazer tudo de uma vez. Uma ação por dia do plano = 30 ações em 30 dias = transformação real.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Mande dúvidas específicas</h4><p>WhatsApp (31) 98339-1576. Seja específico: "Carlos, usei o script de atendimento e o cliente disse X. O que respondo?" é muito melhor que "Carlos, está dando certo?"</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Compartilhe os resultados</h4><p>Carlos vai querer saber o que está funcionando. Um print de "consegui meu primeiro orçamento de R$800" é combustível para continuar.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Revise o plano na semana 2</h4><p>Após 2 semanas, mande uma atualização para Carlos. Se algo não está funcionando, ele vai ajustar a estratégia.</p></div></div>
<h2 class="ah2">Agendando sua sessão agora</h2>

// ── LÓGICA DO CURSO ──
function totalAulas(){return MODULOS.reduce((s,m)=>s+m.aulas.length,0);}

function getAula(idx){
  let n=0;
  for(const m of MODULOS){
    for(const a of m.aulas){
      if(n===idx) return {...a,mod:m.mod};
      n++;
    }
  }
  return null;
}

function renderSidebar(){
  const c=document.getElementById('sbModulos');
  c.innerHTML='';
  let n=0;
  MODULOS.forEach(mod=>{
    const div=document.createElement('div');
    const mt=document.createElement('div');
    mt.className='sb-mod-titulo';
    mt.textContent=mod.mod;
    div.appendChild(mt);
    mod.aulas.forEach((a,ai)=>{
      const idx=n;
      const done=(prog['done_'+CURSO_ID]||[]).includes(idx);
      const li=document.createElement('div');
      li.className='sb-aula'+(idx===aulaAtual?' active':'')+(done?' done':'');
      li.innerHTML=`<span class="sb-aula-num">${String(idx+1).padStart(2,'0')}</span><span class="sb-aula-nome">${a.t}</span>${done?'<span class="sb-aula-check">✓</span>':''}`;
      li.onclick=()=>irAula(idx);
      div.appendChild(li);
      n++;
    });
    c.appendChild(div);
  });
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  const pct=Math.round((done/total)*100);
  document.getElementById('progressoPct').textContent=pct+'%';
  document.getElementById('progressoFill').style.width=pct+'%';
}

function renderAula(){
  const a=getAula(aulaAtual);
  if(!a) return;
  document.getElementById('mhTitulo').textContent=a.t;
  document.getElementById('aulaContent').innerHTML=a.c;
  document.getElementById('btnAnt').disabled=aulaAtual===0;
  document.getElementById('btnProx').disabled=aulaAtual>=totalAulas()-1;
  window.scrollTo(0,0);
}

function irAula(idx){
  aulaAtual=idx;
  prog['aula_'+CURSO_ID]=idx;
  salvar();
  renderSidebar();
  renderAula();
}

function navAula(dir){
  const n=aulaAtual+dir;
  if(n>=0&&n<totalAulas()) irAula(n);
}

function concluirAula(){
  if(!prog['done_'+CURSO_ID]) prog['done_'+CURSO_ID]=[];
  if(!prog['done_'+CURSO_ID].includes(aulaAtual)) prog['done_'+CURSO_ID].push(aulaAtual);
  salvar();
  renderSidebar();
  if(aulaAtual<totalAulas()-1) navAula(1);
  else{alert('🎉 Parabéns! Você concluiu o curso Mentoria VIP 1:1!');}
}

function salvar(){
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  prog[CURSO_ID]=Math.round((done/total)*100);
  localStorage.setItem('ct_progresso_'+(sessao?.email||''),JSON.stringify(prog));
}

renderSidebar();
renderAula();
</script>
