<style>

<script>
const sessao = JSON.parse(sessionStorage.getItem('ct_sessao')||'null');
if(!sessao) window.location.href='acesso.html';
const CURSO_ID = 'curso-posicionamento';
const prog = JSON.parse(localStorage.getItem('ct_progresso_'+(sessao?.email||''))||'{}');
let aulaAtual = prog['aula_'+CURSO_ID]||0;

const MODULOS = [
  {mod:'MÓDULO 1 — MENTALIDADE E PRECIFICAÇÃO PREMIUM', aulas:[
    {t:'Por que você precisa cobrar mais', c:`
<div class="aula-tag">Módulo 1 · Aula 1</div>
<h1 class="aula-h1">Por que você precisa <span>cobrar mais</span></h1>
<p class="aula-intro">Tatuadores que cobram barato trabalham mais, ganham menos e ficam esgotados. Tatuadores que cobram o preço justo trabalham com clientes melhores, têm mais tempo e ganham mais. Essa aula vai reprogramar sua mentalidade sobre valor e preço.</p>
<h2 class="ah2">O paradoxo do preço baixo</h2>
<p class="ap">Existe uma crença muito comum entre tatuadores iniciantes — e até mesmo entre os experientes — de que cobrar barato garante mais clientes. Na prática, o que acontece é o oposto: o preço baixo atrai o tipo de cliente que mais dá trabalho e menos valoriza o resultado.</p>
<ul class="checklist"><li>Cliente que busca o mais barato raramente fica satisfeito com o resultado</li><li>Preço baixo sinaliza baixa qualidade, mesmo que seu trabalho seja excelente</li><li>Tatuador barato atrai cliente difícil, exigente e que não respeita o processo</li><li>Preço alto naturalmente filtra e atrai cliente que confia e respeita o profissional</li><li>Cobrar barato é sempre uma escolha — nunca uma necessidade do mercado</li></ul>
<div class="destaque"><p><strong>Matemática real:</strong> Um tatuador que cobra R$200 e faz 15 tatuagens/mês = R$3.000. Um que cobra R$600 e faz 8 tatuagens/mês = R$4.800. Menos trabalho, mais dinheiro, clientes melhores. Qual você prefere?</p></div>
<h2 class="ah2">A virada de chave mental</h2>
<p class="ap">Você não vende tatuagem. Você vende uma obra de arte permanente, a expressão da identidade de uma pessoa, uma experiência premium que vai durar décadas. Quem entende isso cobra diferente e atrai clientes diferentes.</p>
<p class="ap">O maior erro de precificação que um tatuador pode cometer é olhar para o preço do concorrente e cobrar igual ou menos. Isso é uma corrida para o fundo do poço onde ninguém ganha — exceto o cliente que quer pagar menos.</p>
<h2 class="ah2">Identidade de preço: como você quer ser percebido?</h2>
<p class="ap">Seu preço é a primeira impressão que você causa. Antes do cliente ver seu portfólio, antes de entrar no seu estúdio, o preço já comunicou quem você é. Um orçamento de R$150 diz algo completamente diferente de um de R$600 para exatamente o mesmo tamanho de tatuagem.</p>
<ul class="checklist"><li>Defina hoje que tipo de tatuador você quer ser em 3 anos</li><li>Olhe para referências premium e estude como eles se posicionam</li><li>Aceite que subir preço significa perder alguns clientes — os que você não quer de qualquer forma</li><li>Os clientes que ficam quando você sobe o preço são os que você quer para sempre</li></ul>
<div class="alerta"><p><strong>Atenção:</strong> Subir preço sem ajustar portfólio, atendimento e branding gera resistência. Todas as aulas deste curso trabalham em conjunto para você fazer essa transição de forma sustentável.</p></div>
<div class="dica"><p><strong>Ação imediata:</strong> Calcule agora quantas tatuagens você faria com seu preço atual para atingir R$8.000/mês. Depois calcule com um preço 60% maior. A diferença visual é impactante.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)" disabled>← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Precificação estratégica na prática', c:`
<div class="aula-tag">Módulo 1 · Aula 2</div>
<h1 class="aula-h1">Precificação Estratégica <span>na Prática</span></h1>
<p class="aula-intro">Aqui você aprende a calcular seu preço de forma profissional — baseado em custos reais, tempo e valor percebido. Não em achismo ou no que o concorrente cobra. Com uma planilha e lápis na mão, você vai sair dessa aula com o seu preço real calculado.</p>
<h2 class="ah2">Calculando seu custo real por hora</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Liste todos os seus custos fixos mensais</h4><p>Aluguel do estúdio ou percentual sobre o aluguel, materiais mensais (tintas, agulhas, plástico, película), energia elétrica (estime), internet, contador ou assessoria, plataformas digitais (Instagram Ads, aplicativos), manutenção de equipamentos. Some tudo.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Defina quantas horas você trabalha por dia</h4><p>Considere: sessões de tatuagem + tempo de desenho e projeto + atendimento de mensagens + estudo e aprimoramento. Seja honesto. A maioria trabalha 7-9 horas reais, mas apenas 4-6 horas geram receita diretamente.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Calcule o custo mínimo por hora</h4><p>Fórmula: (Custos fixos mensais ÷ dias úteis) ÷ horas produtivas por dia = custo/hora. Sobre isso, adicione sua margem de lucro. O mínimo recomendado: 60-100% acima do custo.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Defina o valor por tipo de projeto</h4><p>Fineline pequeno (1-2h), old school médio (3-4h), realismo grande (6-8h+). Cada categoria tem um valor hora que pode variar. Realismo e aquarela justificam preço/hora maior que lettering simples.</p></div></div>
<div class="exemplo"><div class="exemplo-label">Exemplo de cálculo completo — tatuador em BH</div><p>Custos fixos: R$2.800/mês ÷ 22 dias úteis = R$127/dia<br>5 horas produtivas/dia → custo: R$25/hora<br>Margem 100% → preço mínimo: R$50/hora<br>Tatuagem de 4h → mínimo para cobrir custos: R$200<br><strong>Com posicionamento premium: R$250-350/hora = R$1.000-1.400 por essa mesma tatuagem</strong></p></div>
<h2 class="ah2">Tabela de referência para BH — 2026</h2>
<ul class="checklist"><li><strong>Mercado básico (iniciante):</strong> R$80-130/hora</li><li><strong>Mercado intermediário (3-5 anos):</strong> R$150-250/hora</li><li><strong>Mercado premium (especialista):</strong> R$280-500/hora</li><li><strong>Top artistas referência BH:</strong> R$600-1.000+/hora</li><li><strong>Top artistas nacionais:</strong> R$1.500-3.000+/hora</li></ul>
<h2 class="ah2">Tabela por estilo</h2>
<p class="ap">Diferentes estilos justificam preços diferentes pelo grau de complexidade técnica e demanda de mercado:</p>
<ul class="checklist"><li><strong>Lettering simples:</strong> coeficiente 0,8 (abaixo da média)</li><li><strong>Old School / Tradicional:</strong> coeficiente 1,0 (média)</li><li><strong>Blackwork / Geométrico:</strong> coeficiente 1,2</li><li><strong>Aquarela / Trash Polka:</strong> coeficiente 1,4</li><li><strong>Fineline detalhado:</strong> coeficiente 1,3</li><li><strong>Realismo P&B:</strong> coeficiente 1,6</li><li><strong>Realismo colorido:</strong> coeficiente 1,8</li></ul>
<div class="destaque"><p><strong>Regra de ouro:</strong> Nunca precifique abaixo do custo, nunca copie o preço do concorrente, nunca dê desconto antes de o cliente pedir — e mesmo quando pedir, ofereça uma versão menor em vez de desconto no preço.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'A psicologia por trás do preço alto', c:`
<div class="aula-tag">Módulo 1 · Aula 3</div>
<h1 class="aula-h1">A Psicologia <span>por Trás do Preço Alto</span></h1>
<p class="aula-intro">Preço é psicologia antes de ser matemática. Entender como o cérebro do cliente processa valor e preço é a chave para nunca mais precisar justificar por que você cobra o que cobra.</p>
<h2 class="ah2">Efeito âncora: por que mostrar preços altos primeiro ajuda</h2>
<p class="ap">Quando você mostra seu trabalho mais caro e mais impressionante primeiro, todos os outros preços parecem mais acessíveis por comparação. Um tatuador que cobra R$2.000 por uma manga parece razoável quando cobra R$400 por uma tatoo pequena.</p>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Exiba sempre seu melhor trabalho em destaque</h4><p>O trabalho mais impressionante do portfólio deve ser o primeiro. Não o mais barato, não o mais simples. O que faz a pessoa parar e pensar "nossa, que incrível".</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Mencione projetos grandes ao apresentar projetos menores</h4><p>Ao receber um orçamento para tatoo pequena, mencione: "Atualmente estou desenvolvendo uma manga para um cliente que vai levar 12 sessões." Isso ancora sua percepção de valor.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Nunca comece o orçamento pelo preço mais baixo</h4><p>Sempre inicie pela versão completa do projeto. Se o cliente quiser simplificar, você tem margem. Se começar pelo mínimo, qualquer variação para cima parecerá cara.</p></div></div>
<h2 class="ah2">Princípio da escassez e exclusividade</h2>
<p class="ap">O que é fácil de conseguir tem pouco valor percebido. O que é difícil, exclusivo ou tem agenda cheia é desejado. Você pode criar escassez de forma legítima:</p>
<ul class="checklist"><li>Agenda com poucas vagas disponíveis (e comunicar isso)</li><li>Lista de espera para novos clientes</li><li>"Apenas X vagas por mês para novos projetos"</li><li>Aceitar apenas projetos dentro do seu estilo preferido</li><li>Exigir sinal de 40-50% para confirmar a vaga</li></ul>
<h2 class="ah2">Preço como filtro de cliente ideal</h2>
<p class="ap">Clientes que pagam mais tendem a se comprometer mais, respeitar mais o processo, comparecer às sessões, seguir os cuidados pós-tattoo e indicar outros clientes semelhantes. O preço é uma peneira automática.</p>
<div class="destaque"><p><strong>Técnica dos 3 preços:</strong> Ao enviar orçamento, apresente 3 opções: a versão mínima (só o básico), a versão ideal (o que você recomenda) e a versão completa (versão premium com todas as melhorias). A maioria escolhe a do meio — que é onde está sua margem ideal.</p></div>
<div class="alerta"><p><strong>Armadilha comum:</strong> Tatuadores que baixam o preço quando sentem resistência estão ensinando o cliente a sempre negociar. Uma vez que você cede no preço, o cliente vai negociar em todas as interações futuras.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Como migrar de preço sem perder clientes', c:`
<div class="aula-tag">Módulo 1 · Aula 4</div>
<h1 class="aula-h1">Como Migrar de Preço <span>sem Perder Clientes</span></h1>
<p class="aula-intro">A maior dúvida de quem quer cobrar mais é: "E os meus clientes atuais? Vão embora?". Sim, alguns vão. E isso é bom. Essa aula tem o plano completo para fazer a transição de forma estratégica.</p>
<h2 class="ah2">A verdade sobre perder clientes ao subir preço</h2>
<p class="ap">Quando você sobe o preço, parte dos clientes vai embora. Essa é a realidade. Mas observe o seguinte: esses clientes que vão embora são exatamente os que mais consomem seu tempo, que mais questionam o orçamento, que mais atrasam pagamento, que mais faltam às sessões.</p>
<p class="ap">Os clientes que ficam são os que mais valorizam seu trabalho, que indicam amigos, que pagam no prazo, que seguem os cuidados pós-tattoo. A qualidade da sua carteira de clientes melhora drasticamente.</p>
<h2 class="ah2">Plano de transição em 3 fases</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Fase 1 — Meses 1 e 2: Reajuste gradual</h4><p>Aumente 20-30% nos orçamentos para NOVOS clientes apenas. Mantenha os preços antigos para a base existente por enquanto. Use esse período para melhorar portfólio, identidade visual e atendimento.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Fase 2 — Meses 3 e 4: Comunicação com base atual</h4><p>Avise seus clientes fiéis com pelo menos 60 dias de antecedência sobre a atualização de preços. Ofereça uma sessão no preço antigo como "cortesia de fidelidade". Isso cria goodwill e fecha agenda.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Fase 3 — Meses 5 e 6: Transição completa</h4><p>Todos os novos orçamentos no preço novo. Agenda com 20-30% menos clientes mas faturamento igual ou maior. Portfólio atualizado com apenas trabalhos premium em destaque.</p></div></div>
<h2 class="ah2">Comunicando o aumento de forma profissional</h2>
<div class="exemplo"><div class="exemplo-label">Mensagem para clientes fiéis</div><p>"[Nome], como você é um cliente especial do estúdio, quero te avisarcom antecedência que estou atualizando minha tabela de preços a partir de [data], para continuar investindo em materiais e cursos de aprimoramento. Até [data], você pode fechar sessões no preço atual. Vamos marcar algo?"</p></div>
<h2 class="ah2">Quais clientes comunicar e quais deixar descobrir naturalmente</h2>
<ul class="checklist"><li><strong>Comunicar:</strong> Clientes que fizeram 3+ sessões com você, indicadores frequentes, VIPs que pagam sem questionar</li><li><strong>Não comunicar:</strong> Clientes que somem e voltam só quando querem promo, que sempre questionam preço, que atrasam pagamento</li><li><strong>Redirecionar:</strong> Clientes com perfil "barato" podem ser redirecionados para tatuadores iniciantes que você conhece — isso é elegante e profissional</li></ul>
<div class="dica"><p><strong>Dica de ouro:</strong> Quando um cliente pergunta se você vai dar desconto, responda com confiança: "Meus preços refletem a qualidade e o cuidado que coloco em cada projeto. Posso ajustar o tamanho ou a complexidade, mas não o valor hora." E pare de falar. O silêncio é seu aliado.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Metas financeiras e planejamento anual', c:`
<div class="aula-tag">Módulo 1 · Aula 5</div>
<h1 class="aula-h1">Metas Financeiras <span>e Planejamento Anual</span></h1>
<p class="aula-intro">Um tatuador sem meta financeira é um barco sem leme. Você pode trabalhar muito e nunca saber se está progredindo. Essa aula cria seu plano financeiro anual do zero.</p>
<h2 class="ah2">Por que 90% dos tatuadores não têm meta</h2>
<p class="ap">Não é falta de ambição. É falta de método. A maioria dos tatuadores opera no modo "cada sessão que chega é lucro", sem entender exatamente quanto precisa ganhar para pagar todas as contas, guardar para emergências, investir no negócio e ainda ter qualidade de vida.</p>
<h2 class="ah2">As 4 camadas do faturamento</h2>
<ul class="checklist"><li><strong>Camada 1 — Sobrevivência:</strong> Cobre todas as contas fixas pessoais + do estúdio. Mínimo absoluto.</li><li><strong>Camada 2 — Estabilidade:</strong> Sobrevivência + 3 meses de reserva + investimento em equipamentos</li><li><strong>Camada 3 — Crescimento:</strong> Estabilidade + verba de marketing + cursos + viagens para convenções</li><li><strong>Camada 4 — Prosperidade:</strong> Crescimento + poupança/investimentos + expansão do negócio</li></ul>
<div class="exemplo"><div class="exemplo-label">Cálculo das camadas — exemplo BH 2026</div><p>Contas pessoais: R$3.500 | Contas estúdio: R$2.500 → Sobrevivência: R$6.000/mês<br>Reserva de emergência (1/12 de 3 meses): R$1.500 → Estabilidade: R$7.500/mês<br>Marketing + cursos: R$800 → Crescimento: R$8.300/mês<br>Investimentos pessoais: R$1.200 → Prosperidade: R$9.500/mês</p></div>
<h2 class="ah2">Calculando de trás para frente</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Defina a meta mensal</h4><p>Comece pela Camada 2 (Estabilidade). Quanto é o seu número?</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Calcule o ticket médio necessário</h4><p>Meta mensal ÷ número de sessões que quer fazer por mês = ticket médio necessário</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Compare com seu ticket atual</h4><p>Se a conta não fecha, o caminho é: aumentar preço ou aumentar número de sessões (ou os dois)</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Defina o calendário de execução</h4><p>Em que data você quer estar na Camada 2? Camada 3? Crie marcos trimestrais e coloque na agenda.</p></div></div>
<h2 class="ah2">Sazonalidade no mercado de tatuagem</h2>
<p class="ap">O mercado de tatuagem tem padrões sazonais que você precisa considerar no planejamento:</p>
<ul class="checklist"><li><strong>Janeiro/Fevereiro:</strong> Pós-festas, clientes voltam com novas metas. Bom para prospectar.</li><li><strong>Março/Abril:</strong> Mercado estável, boa demanda regular.</li><li><strong>Maio/Junho:</strong> Pico de demanda (inverno, menos praia, mais tatuagem).</li><li><strong>Julho:</strong> Queda moderada, período de férias.</li><li><strong>Agosto/Setembro:</strong> Recuperação forte, período de convenções.</li><li><strong>Outubro/Novembro:</strong> Pico máximo do ano, reserve agenda com antecedência.</li><li><strong>Dezembro:</strong> Queda acentuada após o dia 15. Use para descanso e planejamento.</li></ul>
<div class="destaque"><p><strong>Estratégia para meses fracos:</strong> Use Janeiro e Julho para lançar promoções de sessões com data marcada (não desconto no preço, mas condições especiais como dividir em mais vezes ou incluir retoque gratuito).</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
  ]},

    {t:'Construindo sua identidade visual completa', c:`
<div class="aula-tag">Módulo 2 · Aula 6</div>
<h1 class="aula-h1">Construindo sua <span>Identidade Visual Completa</span></h1>
<p class="aula-intro">Identidade visual profissional não é luxo — é o investimento com melhor retorno para um tatuador que quer cobrar mais. Um estúdio com visual coeso e premium justifica preços mais altos e atrai um perfil de cliente completamente diferente.</p>
<h2 class="ah2">Os 5 pilares da identidade visual de um tatuador premium</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Logo profissional</h4><p>Uma boa logo custa entre R$300-800 e dura anos. Invista em um designer ou use o Canva Pro com templates premium. Evite logos genéricas com fontes padrão do Word. A logo é o rosto do seu negócio.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Paleta de cores consistente</h4><p>Máximo 3 cores. Combinações que funcionam: preto + dourado = luxo premium | preto + vermelho = arte intensa | preto + branco + off-white = minimalismo elegante | preto + azul petróleo = sofisticação contemporânea.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Tipografia definida</h4><p>Escolha 2 fontes: uma para títulos (serifada elegante como Playfair Display ou uma script premium) e uma para textos (sans-serif limpa como Poppins ou Montserrat). Jamais misture mais de 3 fontes.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Tom de voz e linguagem</h4><p>Como você escreve define sua marca. Defina: casual amigável? Técnico especialista? Artístico e poético? E mantenha esse tom em 100% das comunicações — legendas, mensagens, respostas.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Aplicações da marca</h4><p>Onde sua identidade vai aparecer: Instagram, cartões, embalagens, papel de cuidados pós-tattoo, uniforme/roupas usadas nas fotos, a estética física do estúdio.</p></div></div>
<h2 class="ah2">O estúdio como parte da marca</h2>
<p class="ap">Seu espaço de trabalho é o cenário onde suas fotos são tiradas, onde clientes fazem stories, onde a experiência acontece. Um estúdio com visual coerente e fotografável multiplica seu conteúdo organicamente.</p>
<ul class="checklist"><li>Paredes em cor que combina com sua identidade (dark, clean, industrial)</li><li>Iluminação quente ou fria — defina e padronize</li><li>Área de espera com personalidade (não genérica)</li><li>Quadros, referências ou elementos decorativos que refletem seu estilo</li><li>Mesa/cadeira fotogênicas para fazer fotos do processo</li></ul>
<div class="destaque"><p><strong>Exercício prático:</strong> Abra o Instagram de 3 tatuadores que você admira e que cobram mais que você. Anote: paleta de cores dos posts, tom de voz das legendas, como a bio está escrita, como o feed está organizado. Você vai notar padrões claros de branding premium.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Como fotografar seus trabalhos profissionalmente', c:`
<div class="aula-tag">Módulo 2 · Aula 7</div>
<h1 class="aula-h1">Como Fotografar <span>seus Trabalhos Profissionalmente</span></h1>
<p class="aula-intro">Uma tatuagem excelente mal fotografada vale menos que uma tatuagem boa bem fotografada. Fotografia é onde o trabalho vira portfólio, e portfólio é vendas. Você precisa dominar isso.</p>
<h2 class="ah2">Por que a maioria das fotos de tatuagem são ruins</h2>
<ul class="checklist"><li>Flash direto que estoura a textura e detalhe da tatuagem</li><li>Fundo bagunçado que distrai do trabalho</li><li>Foto tremida ou fora de foco</li><li>Angulação errada que distorce a tatuagem</li><li>Foto logo após a sessão, com pele vermelha e trauma visível</li><li>Excesso de sombra que esconde o detalhe</li></ul>
<h2 class="ah2">Configurações básicas para fotos no celular</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Luz natural é sua melhor amiga</h4><p>Fotografe perto de janela grande com luz natural indireta. Nunca com flash. Nunca com luz amarela de lâmpada incandescente. A melhor luz é a de manhã ou tarde, com sol difuso.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Foco manual no celular</h4><p>Toque na tatuagem na tela para forçar o foco nela. Aguarde 2 segundos antes de tirar a foto para estabilizar.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Ângulo perpendicular ao plano da pele</h4><p>A câmera deve estar paralela à superfície da tatuagem, não angulada. Para tatuagem no braço, segure o braço horizontalmente e posicione o celular em cima, paralelo ao braço.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Fundo neutro e limpo</h4><p>Mantenha um pedaço de papel cartão preto ou branco no estúdio para usar como fundo quando necessário. Tecido de cor sólida também funciona.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Edição básica no Lightroom Mobile (gratuito)</h4><p>Aumente levemente a clareza (+10 a +20), eleve um pouco o contraste, verifique se as cores estão fiéis. Evite filtros que mudam as cores da tinta.</p></div></div>
<h2 class="ah2">Quando fotografar: timing ideal</h2>
<ul class="checklist"><li><strong>Melhor momento:</strong> Imediatamente após limpar a tatuagem, antes de aplicar o filme. A pele ainda está intacta e a tinta está viva.</li><li><strong>Segundo melhor:</strong> Após a cicatrização completa (30-45 dias). Cores mais suaves mas tatuagem final.</li><li><strong>Evite:</strong> Foto com pele vermelha, inchada, com sangue ou com muita pomada brilhando.</li></ul>
<h2 class="ah2">Montar o portfólio fotográfico</h2>
<p class="ap">Não publique tudo. Publique apenas o seu melhor. Um portfólio com 30 fotos excelentes é infinitamente mais poderoso que um com 200 fotos medianas.</p>
<div class="destaque"><p><strong>Ferramenta recomendada:</strong> Para edição de fotos de tatuagem, o Lightroom Mobile (gratuito) com preset de "Tattoo" tem melhores resultados que filtros do Instagram. Procure presets gratuitos específicos para fotos de tatuagem no Pinterest.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Bio e feed do Instagram que vendem', c:`
<div class="aula-tag">Módulo 2 · Aula 8</div>
<h1 class="aula-h1">Bio e Feed do Instagram <span>que Vendem</span></h1>
<p class="aula-intro">Seu Instagram é sua vitrine, seu currículo e seu vendedor 24 horas. A maioria dos tatuadores trata como diário pessoal. Os que cobram mais tratam como ferramenta de negócio. Veja a diferença.</p>
<h2 class="ah2">Anatomia da bio perfeita para tatuador premium</h2>
<p class="ap">Você tem 150 caracteres para convencer um estranho de que vale a pena te seguir e te contratar. Cada palavra importa:</p>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Primeira linha: quem você é + diferencial</h4><p>"Tatuador especialista em Realismo P&B" | "Fine Line Art · BH" | "Blackwork & Geometric · São Paulo"</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Segunda linha: para quem você é</h4><p>"Para quem quer uma obra de arte permanente" | "Projetos exclusivos por encomenda" | "Agenda fechada — lista de espera aberta"</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Terceira linha: localização + contato</h4><p>"📍 Estúdio em Savassi, BH" + link para WhatsApp</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Link na bio: direcione para o que converte</h4><p>Use Linktree ou link direto para WhatsApp com mensagem pré-preenchida: "wa.me/5531XXXXXXXX?text=Olá!+Vim+pelo+Instagram+e+quero+um+orçamento"</p></div></div>
<h2 class="ah2">Estratégia de feed: coerência visual</h2>
<p class="ap">O feed é visto como um todo antes de o cliente clicar em qualquer foto. Quando um potencial cliente visita seu perfil, em 3 segundos decide se vai seguir ou não. A coerência visual é o que retém.</p>
<ul class="checklist"><li>Escolha uma paleta e siga: fotos todas com fundo escuro, ou todas claras, ou todas em local específico</li><li>Alterne entre: foto do trabalho finalizado | foto do processo | foto dos detalhes (close up)</li><li>Evite misturar fotos pessoais, viagens ou comida no mesmo feed de portfólio</li><li>Use destaques (Highlights) para organizar: estilos, processo, depoimentos, preços/FAQ</li></ul>
<h2 class="ah2">Destaques que convertem</h2>
<ul class="checklist"><li>📁 PORTFÓLIO — Melhores trabalhos separados por estilo</li><li>✍️ PROCESSO — Stories do desenho até o resultado final</li><li>💬 DEPOIMENTOS — Print de mensagens de clientes satisfeitos</li><li>📋 FAQ — Respondendo as dúvidas mais comuns sobre preço, cuidados, processo</li><li>📍 ESTÚDIO — Como é o ambiente, como funciona o atendimento</li></ul>
<div class="exemplo"><div class="exemplo-label">Bio que converte — exemplo real</div><p>Fine Line & Botanical · BH 🌿<br>Projetos exclusivos por encomenda<br>📅 Agenda: link na bio<br>↓ Veja como funciona</p></div>
<div class="destaque"><p><strong>Teste rápido:</strong> Abra seu Instagram agora e simule ser um desconhecido vendo seu perfil pela primeira vez. Sua bio explica o que você faz? Tem CTA (call to action)? O feed transmite a qualidade que você cobra? Se não, você sabe o que precisa mudar.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Criando conteúdo que atrai clientes premium', c:`
<div class="aula-tag">Módulo 2 · Aula 9</div>
<h1 class="aula-h1">Criando Conteúdo <span>que Atrai Clientes Premium</span></h1>
<p class="aula-intro">Não basta postar foto de tatuagem. Os tatuadores que mais faturam criam conteúdo que educa, inspira e qualifica o cliente antes mesmo do primeiro contato. Nesta aula você aprende a estratégia de conteúdo completa.</p>
<h2 class="ah2">Os 4 tipos de conteúdo que funcionam para tatuadores</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Portfólio — mostrar o resultado</h4><p>Foto e vídeo do trabalho finalizado. Sempre com boa iluminação, fundo limpo, legenda que conta a história do projeto. Este é o conteúdo mais óbvio mas precisa ser bem executado.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Processo — mostrar o making of</h4><p>Vídeo timelapse da sessão, stories do desenho, Reels mostrando antes+depois. Conteúdo de processo tem altíssimo engajamento e humaniza o artista.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Educação — posicionar como especialista</h4><p>Posts sobre cuidados pós-tattoo, como escolher o estilo certo, o que afeta a cicatrização, mitos e verdades. Quem educa é percebido como autoridade.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Bastidores — conectar com a pessoa</h4><p>O dia a dia do estúdio, os materiais, o processo de criação do desenho, uma frase sobre a arte. Cria conexão emocional e fideliza seguidores.</p></div></div>
<h2 class="ah2">Frequência e consistência</h2>
<p class="ap">Para crescer no Instagram organicamente, a mínima consistência é: 3-4 posts por semana no feed + 5-7 stories por dia. Mais importante que frequência alta é a consistência: é melhor 3 posts excelentes por semana toda semana do que 10 posts ruins uma semana e sumir nas outras.</p>
<h2 class="ah2">Legendas que vendem</h2>
<ul class="checklist"><li>Comece com a história, não com a descrição técnica: "Esse projeto surgiu de..." em vez de "Tatuagem realismo P&B..."</li><li>Inclua o processo: "Foram X horas de sessão, o cliente ficou..."</li><li>Faça uma pergunta ou convite no final: "Você tem um projeto em mente?"</li><li>Use hashtags segmentadas: misture hashtags grandes (#tattoo) com nichos (#blackworktattoo) e locais (#tatuagemBH)</li></ul>
<h2 class="ah2">Reels: o formato que mais cresce atualmente</h2>
<p class="ap">Reels têm alcance orgânico muito maior que posts estáticos em 2026. Um timelapse de 30-60 segundos de uma sessão com música de fundo, sem narração, pode alcançar 10-50x mais pessoas que um post comum.</p>
<div class="destaque"><p><strong>Calendário de conteúdo semanal:</strong> Segunda: Portfólio | Terça: Stories processo | Quarta: Post educativo | Quinta: Reels timelapse | Sexta: Antes+depois | Sábado: Bastidores | Domingo: Descanso ou story simples</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
  ]},
  {mod:'MÓDULO 3 — ATENDIMENTO VIP & FIDELIZAÇÃO', aulas:[
    {t:'O fluxo de atendimento premium do primeiro contato ao fechamento', c:`
<div class="aula-tag">Módulo 3 · Aula 10</div>
<h1 class="aula-h1">O Fluxo de Atendimento Premium <span>do Primeiro Contato ao Fechamento</span></h1>
<p class="aula-intro">A experiência do cliente começa muito antes da sessão e termina muito depois. Cada ponto de contato é uma oportunidade de fortalecer ou destruir a percepção de valor. Aqui está o mapa completo.</p>
<h2 class="ah2">Os 7 pontos de contato com o cliente</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Primeiro contato (mensagem inicial)</h4><p>O cliente manda uma mensagem pelo Instagram ou WhatsApp. Sua resposta nos primeiros minutos já define a primeira impressão. Velocidade + profissionalismo = confiança.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Qualificação (entender o projeto)</h4><p>Antes de dar orçamento, colete informações: qual é a ideia, tamanho, região do corpo, referências, data desejada. Isso demonstra que você é profissional e que o projeto é personalizado.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Apresentação do orçamento</h4><p>Nunca dê preço seco. Contextualize o valor: o que inclui, quanto tempo, que material. O orçamento apresentado com contexto tem taxa de fechamento muito maior.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Confirmação e coleta do sinal</h4><p>Após a aceitação, defina data e colete o sinal de 40-50%. Sem sinal, sem vaga confirmada. Isso reduz cancelamentos de última hora em 80%.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Pré-sessão (confirmação e preparação)</h4><p>24-48h antes, mande mensagem confirmando, lembrando cuidados de preparação (hidratação, alimentação, sono) e reforçando o endereço e horário.</p></div></div>
<div class="passo"><div class="passo-n">6</div><div class="passo-body"><h4>A sessão em si (experiência no estúdio)</h4><p>Ambiente limpo, música adequada, conversa no ritmo do cliente, explicação do processo. A sessão é onde a percepção de valor é consolidada.</p></div></div>
<div class="passo"><div class="passo-n">7</div><div class="passo-body"><h4>Pós-sessão (cuidados e follow-up)</h4><p>Envie o guia de cuidados pós-tattoo imediatamente após. Acompanhe a cicatrização via mensagem em 7 e 30 dias. Peça avaliação e foto cicatrizada.</p></div></div>
<h2 class="ah2">Templates de mensagem para cada etapa</h2>
<div class="exemplo"><div class="exemplo-label">Primeiro contato</div><p>"Olá [nome]! Que prazer ter você aqui 🙏 Sou o [seu nome] e trabalho com tatuagem há X anos em BH, especializado em [estilo]. Para criar algo realmente único para você, me conta: qual é a sua ideia, onde no corpo você imagina e tem alguma referência salva? 😊"</p></div>
<div class="exemplo"><div class="exemplo-label">Envio de orçamento</div><p>"[Nome], analisei o projeto e fiz o briefing completo. Esse trabalho exige aproximadamente Xh de sessão com materiais importados de primeira linha. O investimento é de R$[valor], que inclui: projeto exclusivo criado especificamente para você, sessão completa com produtos premium e retoque gratuito em até 90 dias. Para a data que você mencionou, tenho disponibilidade em [opções]. Qual funciona melhor?"</p></div>
<div class="destaque"><p><strong>Taxa de fechamento média:</strong> Tatuadores sem processo estruturado fecham 20-30% dos orçamentos. Com o fluxo acima bem executado, essa taxa sobe para 50-70%. A diferença está no processo, não no preço.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Scripts VIP de WhatsApp para cada situação', c:`
<div class="aula-tag">Módulo 3 · Aula 11</div>
<h1 class="aula-h1">Scripts VIP de WhatsApp <span>para Cada Situação</span></h1>
<p class="aula-intro">WhatsApp é onde a maioria das vendas de tatuagem acontece. Ter scripts prontos — não para copiar e colar roboticamente, mas como guia — aumenta drasticamente sua taxa de fechamento e elimina o estresse de "o que responder agora".</p>
<h2 class="ah2">Script 1 — Quando o cliente manda referência vaga</h2>
<div class="exemplo"><div class="exemplo-label">Situação: cliente manda foto e pergunta "quanto fica?"</div><p>"Adorei a referência! Para te dar um orçamento preciso (não um chute), preciso entender melhor o projeto: qual tamanho você imagina? Em qual parte do corpo? Você quer exatamente igual à referência ou adaptado ao seu corpo e estilo? Me conta um pouco mais sobre o que essa tattoo significa para você 😊"</p></div>
<h2 class="ah2">Script 2 — Quando o cliente diz "tá caro"</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Não justifique, explique o valor</h4><p>"Entendo! Esse projeto exige Xh de trabalho com materiais importados de alta qualidade — o resultado vai estar na sua pele pela vida toda. Posso parcelar em X vezes no cartão para facilitar, o que acha?"</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Ofereça alternativa de tamanho, não desconto</h4><p>"Outra opção: posso fazer uma versão um pouco menor/mais simples que fica dentro do seu orçamento atual, mantendo toda a qualidade. Quer que eu te monte um briefing das duas versões para você comparar?"</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Aceite a perda com elegância</h4><p>"Entendo totalmente! Cada artista tem seu posicionamento e o meu é premium mesmo. Se você quiser explorar outras opções, posso te indicar alguns tatuadores excelentes que trabalham numa faixa diferente 🙏"</p></div></div>
<h2 class="ah2">Script 3 — Confirmação de sinal</h2>
<div class="exemplo"><div class="exemplo-label">Após aceitar o orçamento</div><p>"Ótimo, [nome]! Fico feliz em trabalhar nesse projeto com você 🙏 Para confirmar a vaga de [data] às [hora], preciso do sinal de R$[valor] via PIX ([chave]). Assim que confirmar o pagamento, a vaga é sua e me aprofundo no seu projeto. Funciona assim?"</p></div>
<h2 class="ah2">Script 4 — Lembrete de sessão (24h antes)</h2>
<div class="exemplo"><div class="exemplo-label">Mensagem de confirmação</div><p>"Oi [nome]! Amanhã é dia! 🖤 Só lembrando que sua sessão é às [hora] aqui no [endereço]. Umas dicas: durma bem hoje, almoce bem amanhã (glicose ajuda na sessão), se puder hidrate a pele hoje à noite. Qualquer dúvida estou aqui. Até amanhã!"</p></div>
<h2 class="ah2">Script 5 — Pós-sessão (cuidados)</h2>
<div class="exemplo"><div class="exemplo-label">Mensagem imediatamente após a sessão</div><p>"[Nome], obrigado pela sessão de hoje! Foi um prazer trabalhar nesse projeto 🙏 Mandei aqui em baixo o guia completo de cuidados para a sua tattoo cicatrizar perfeitamente. Em caso de dúvida, pode me chamar aqui. Em 30 dias quando tiver curada, me manda foto! Abs"</p></div>
<div class="destaque"><p><strong>Regra de ouro do WhatsApp:</strong> Responda em até 2 horas durante horário comercial. Leads que não são respondidos em até 3-4 horas têm taxa de fechamento 60% menor do que os respondidos na primeira hora.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Como criar uma experiência de estúdio inesquecível', c:`
<div class="aula-tag">Módulo 3 · Aula 12</div>
<h1 class="aula-h1">Como Criar uma Experiência <span>de Estúdio Inesquecível</span></h1>
<p class="aula-intro">Clientes não lembram apenas da tatuagem — eles lembram de como se sentiram. Uma experiência excepcional faz o cliente indicar, voltar e pagar mais. Veja como criar isso sistematicamente.</p>
<h2 class="ah2">Os 5 sentidos na experiência do estúdio</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Visual — o que o cliente vê</h4><p>Estúdio limpo, organizado, com estética coerente com sua marca. Portfólio físico ou tablet com o melhor trabalho. Iluminação bem planejada. Cada elemento visual comunica profissionalismo.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Auditivo — o que o cliente ouve</h4><p>Música ambiente adequada ao seu posicionamento. Conversa respeitosa, sem pressa. O som da máquina funcionando bem (sem ranger ou vibração estranha) transmite segurança.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Olfativo — o que o cliente cheira</h4><p>Estúdio que cheira bem (não ao produto mas a limpo e fresco). Evite cheiro forte de produto de limpeza logo antes da sessão. Uma vela suave ou difusor discreto funciona bem.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Tato — como o cliente se sente fisicamente</h4><p>Cadeira/maca confortável. Temperatura agradável. Pausas quando necessário. Verificar o conforto do cliente regularmente, especialmente em sessões longas.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Emocional — o que o cliente sente</h4><p>Sentir-se ouvido, respeitado, em boas mãos. A tatuagem é um ato de confiança profunda — a pessoa está entregando o corpo para você. Honre isso com toda a atenção e cuidado.</p></div></div>
<h2 class="ah2">Detalhes que fazem a diferença</h2>
<ul class="checklist"><li>Kit de boas-vindas: folder com seus cuidados pós-tattoo com sua marca</li><li>Água, café ou chá disponíveis durante a sessão (sem cobrar)</li><li>Espaço limpo, organizado e com identidade estética</li><li>Explicar o processo antes de começar (o que vai acontecer, o que é normal sentir)</li><li>Perguntar preferências musicais do cliente durante a sessão</li><li>Tirar fotos do processo para o cliente guardar como memória</li></ul>
<h2 class="ah2">O follow-up que fideliza</h2>
<p class="ap">A maioria dos tatuadores desaparece depois da sessão. Os melhores constroem relacionamento. Um contato em 7 dias perguntando sobre a cicatrização e um em 30 dias pedindo a foto cicatrizada são gestos que fazem o cliente virar fã.</p>
<div class="exemplo"><div class="exemplo-label">Mensagem de acompanhamento - 7 dias</div><p>"Oi [nome], tudo bem? Passei para saber como está a cicatrização da sua tattoo! Alguma dúvida sobre os cuidados? Lembrando que em até 90 dias o retoque gratuito está disponível se necessário 🙏"</p></div>
<div class="destaque"><p><strong>Métrica de experiência:</strong> Se seus clientes indicam você espontaneamente sem você pedir, a experiência está boa. Se você precisa sempre pedir indicação, há algo na experiência que pode melhorar.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Fidelização: transformando cliente em fã', c:`
<div class="aula-tag">Módulo 3 · Aula 13</div>
<h1 class="aula-h1">Fidelização: <span>Transformando Cliente em Fã</span></h1>
<p class="aula-intro">Um cliente fiel que faz uma tatuagem por ano e indica 2 amigos vale 10x mais que um cliente avulso. A fidelização é onde o negócio escala sem aumentar custo de aquisição de clientes.</p>
<h2 class="ah2">Por que fidelizar custa menos do que captar</h2>
<p class="ap">Captar um novo cliente (via Instagram, tráfego pago, indicação) custa tempo e dinheiro. Um cliente fidelizado já te conhece, já confia em você, já sabe seu processo e já pagou o preço sem questionar. A matemática é simples.</p>
<ul class="checklist"><li>Custo de aquisição de novo cliente: R$50-200 (em tempo ou dinheiro de marketing)</li><li>Custo de reter um cliente existente: R$5-20 (mensagem, atenção, cuidado)</li><li>Cliente fidelizado gasta em média 67% mais por sessão do que cliente novo</li><li>Cliente fidelizado indica em média 2-4 novos clientes por ano</li></ul>
<h2 class="ah2">Programa de fidelidade para estúdio de tatuagem</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Sistema de pontos simples</h4><p>Cada R$100 em tatuagem = 1 ponto. A cada 10 pontos = 1 hora de retoque gratuito. Simples, transparente e que incentiva o retorno.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Status VIP para grandes clientes</h4><p>Clientes com mais de R$2.000 acumulados = status VIP: prioridade de agenda, 10% de desconto em sessões futuras, acesso à agenda antes de outros clientes.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Atenção em datas especiais</h4><p>Mande mensagem de aniversário (você tem a data no CRM). Um "feliz aniversário, [nome]! Se quiser comemorar com uma nova tattoo, tenho uma condição especial este mês" converte muito bem.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Coleção de tatuagens — storytelling de longo prazo</h4><p>Para clientes que fazem múltiplas tatuagens, proponha um conceito que conecte todas. Isso cria engajamento de longo prazo e um projeto que o cliente quer completar.</p></div></div>
<h2 class="ah2">Pedindo indicações da forma certa</h2>
<div class="exemplo"><div class="exemplo-label">Pedido de indicação (nunca peça em vão)</div><p>"[Nome], fico muito feliz que você adorou o resultado! Se você conhece alguém com uma ideia especial para uma tattoo e que valoriza qualidade, ficaria feliz se você me indicasse. Pode até mandar o contato aqui que eu mesmo entro em contato com carinho 🙏"</p></div>
<div class="destaque"><p><strong>Rede de indicação:</strong> Crie um relacionamento com outros profissionais que atendem o mesmo perfil de cliente (cabeleireiros premium, maquiadores, personal trainers, psicólogos de alto padrão). Uma indicação mútua vale mais que qualquer anúncio pago.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
  ]},
  {mod:'MÓDULO 4 — INSTAGRAM & CRESCIMENTO DIGITAL', aulas:[
    {t:'Algoritmo do Instagram para tatuadores — o que funciona em 2026', c:`
<div class="aula-tag">Módulo 4 · Aula 14</div>
<h1 class="aula-h1">Algoritmo do Instagram <span>para Tatuadores em 2026</span></h1>
<p class="aula-intro">O algoritmo do Instagram mudou muito e continua mudando. O que funcionava em 2022 pode estar prejudicando sua conta hoje. Aqui está o que realmente funciona em 2026 para tatuadores que querem crescer sem pagar por tráfego.</p>
<h2 class="ah2">Como o algoritmo decide quem vê seu conteúdo</h2>
<p class="ap">O algoritmo do Instagram em 2026 prioriza conteúdo com base em 4 fatores principais:</p>
<ul class="checklist"><li><strong>Tempo de visualização:</strong> Quanto tempo as pessoas ficam olhando/assistindo. Conteúdo de processo (timelapse) performa melhor que foto estática.</li><li><strong>Taxa de engajamento inicial:</strong> Likes, comentários e salvamentos nas primeiras 2 horas após postar. Poste quando seus seguidores estão online.</li><li><strong>Salvamentos e compartilhamentos:</strong> São os sinais mais poderosos. Conteúdo educativo ("aprenda sobre cuidados pós-tattoo") é muito salvo.</li><li><strong>Consistência:</strong> Contas que postam regularmente recebem mais distribuição do que contas irregulares.</li></ul>
<h2 class="ah2">O melhor horário para postar</h2>
<p class="ap">Não existe um horário universal. O melhor horário é quando SEU público está ativo. No Instagram, vá em Insights > Público > Horários mais ativos. Geralmente para tatuadores em BH, os picos são:</p>
<ul class="checklist"><li>Segunda a sexta: 12h-13h (almoço) e 19h-21h (pós-expediente)</li><li>Sábado: 10h-12h e 19h-22h</li><li>Domingo: 15h-18h</li></ul>
<h2 class="ah2">Os formatos que mais crescem em 2026</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Reels (vídeos curtos)</h4><p>Prioridade máxima do algoritmo. Um timelapse de 30-60s de uma sessão de tatuagem bem editado pode alcançar 10x mais pessoas que qualquer foto. Grave em boa resolução e adicione música trending.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Carrossel educativo</h4><p>Posts com múltiplas imagens têm engajamento 3x maior. Exemplo: "5 coisas que afetam a cicatrização da sua tatuagem" — 5 slides, um por ponto, com visual profissional.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Stories com interação</h4><p>Enquetes, perguntas e caixas de resposta. Stories que pedem interação aparecem mais vezes para seus seguidores. Faça pelo menos 3 stories por dia.</p></div></div>
<h2 class="ah2">Hashtags em 2026 — como usar certo</h2>
<p class="ap">Hashtags muito grandes (#tattoo tem 200 milhões de posts) quase não trazem resultado. Use uma mistura estratégica:</p>
<ul class="checklist"><li>3-5 hashtags grandes: #tattoo #tatuagem #tattooartist</li><li>5-7 hashtags de nicho: #blackworktattoo #finelinetattoo #realismotatuagem</li><li>3-5 hashtags locais: #tatuagembh #tatuadorbh #tattoobelohorizonte</li><li>2-3 hashtags de estilo: #botanicaltattoo #dotworktattoo</li></ul>
<div class="destaque"><p><strong>Estratégia anti-shadowban:</strong> Não use os mesmos hashtags em todos os posts. Crie 3-4 listas de hashtags diferentes e alterne entre elas. O Instagram penaliza contas que usam exatamente as mesmas hashtags repetidamente.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Reels que viralizam e convertem para tatuadores', c:`
<div class="aula-tag">Módulo 4 · Aula 15</div>
<h1 class="aula-h1">Reels que Viralizam <span>e Convertem para Tatuadores</span></h1>
<p class="aula-intro">Não basta fazer Reels — precisa fazer Reels certos. Existem fórmulas que funcionam especificamente para tatuadores e que convertem visualização em orçamento. Nessa aula, você aprende cada uma delas.</p>
<h2 class="ah2">Os 5 formatos de Reels que mais funcionam para tatuadores</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Timelapse da sessão completa (mais popular)</h4><p>Grave toda a sessão e acelere para 30-60 segundos. Adicione música trending (veja sons em alta no Instagram). Legenda: "X horas de sessão em X segundos". Sempre alcança bem.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Antes e depois com transição (mais engajamento)</h4><p>Foto do esboço ou pele limpa → transição → tattoo finalizada. Pode usar a transição de "virar a câmera" ou um corte simples. Extremamente compartilhável.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Close em detalhes (mais salvamentos)</h4><p>Vídeo lento focando nos detalhes da tatuagem com música suave. Pessoas salvam para mostrar ao tatuador como referência. Funciona muito para fineline, realismo e geométrico.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Processo do desenho ao resultado (mais autoridade)</h4><p>Do esboço em papel/tablet até a tatuagem finalizada. Demonstra sua habilidade artística antes mesmo de começar a tatuar. Gera muito comentário e pergunta de orçamento.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Educativo curto (mais compartilhamento)</h4><p>"3 coisas que você NÃO deve fazer após tatuar" ou "Por que sua tatuagem desbotou? Entenda." Com narração em voz ou texto na tela. Gerado mais alcance orgânico do que portfólio.</p></div></div>
<h2 class="ah2">Edição de Reels para não editores</h2>
<ul class="checklist"><li><strong>CapCut (gratuito):</strong> Melhor aplicativo para editar Reels no celular. Templates prontos que salvam tempo.</li><li><strong>InShot:</strong> Simples e rápido para edições básicas.</li><li><strong>Videoleap:</strong> Para efeitos mais sofisticados.</li><li><strong>Lightroom Mobile:</strong> Para corrigir as cores antes de editar o vídeo.</li></ul>
<h2 class="ah2">CTA (Call to Action) em Reels</h2>
<p class="ap">Todo Reel deve terminar com um chamado para ação claro. Não deixe o viewer sem saber o que fazer:</p>
<ul class="checklist"><li>Orçamento: "Link na bio para falar comigo 📩"</li><li>Seguidores: "Siga para mais trabalhos assim 🖤"</li><li>Interação: "Me conta: você faria uma igual? 👇"</li><li>Salvamento: "Salva para mostrar ao seu tatuador"</li></ul>
<div class="destaque"><p><strong>Consistência acima de tudo:</strong> Um Reel fraco publicado é sempre melhor que um Reel perfeito não publicado. Comece simples, aprenda com os dados, melhore gradualmente. O algoritmo favorece contas que publicam regularmente acima de contas que publicam raramente mas de forma "perfeita".</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'TikTok para tatuadores: vale a pena?', c:`
<div class="aula-tag">Módulo 4 · Aula 16</div>
<h1 class="aula-h1">TikTok para Tatuadores: <span>Vale a Pena?</span></h1>
<p class="aula-intro">TikTok é a plataforma com maior alcance orgânico em 2026. Uma conta nova pode alcançar 100 mil pessoas no primeiro mês se o conteúdo for bom. Para tatuadores, o potencial é enorme — mas a estratégia é diferente do Instagram.</p>
<h2 class="ah2">TikTok vs Instagram: entendendo as diferenças</h2>
<ul class="checklist"><li><strong>Algoritmo:</strong> TikTok mostra seu conteúdo para não-seguidores desde o primeiro post. Instagram favorece seguidores existentes.</li><li><strong>Público:</strong> TikTok tem público mais jovem (18-30 anos), Instagram mais equilibrado (18-45 anos).</li><li><strong>Formato:</strong> TikTok é quase 100% vídeo vertical. Instagram aceita foto, carrossel, vídeo.</li><li><strong>Conversão:</strong> Instagram converte melhor em cliente imediato. TikTok constrói audiência mas tem caminho mais longo até o orçamento.</li><li><strong>Vida do conteúdo:</strong> Posts do TikTok podem viralizar semanas depois. Instagram tem shelf-life curto (24-48h).</li></ul>
<h2 class="ah2">Formatos que funcionam no TikTok para tatuadores</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>GRWM do tatuar (Get Ready With Me)</h4><p>Preparação do estúdio, dos materiais, chegada do cliente. Conteúdo humanizado que gera forte conexão emocional.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>FAQ em vídeo curto (15-30s cada)</h4><p>"Quanto tempo cicatriza?" "Dói muito?" "Posso tatuar sobre cicatriz?" Cada pergunta é um vídeo. Alta chance de viralizar pois responde dúvidas de muitos.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Duets e trends adaptadas</h4><p>Pegar uma trend viral e adaptar para o universo da tatuagem. Exemplo: "coisas que só tatuadores entendem".</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Antes e depois dramático</h4><p>O antes-e-depois com transição no TikTok tem altíssimo engajamento. Cover-ups especialmente chamam muita atenção.</p></div></div>
<h2 class="ah2">Vale a pena fazer os dois?</h2>
<p class="ap">Sim — mas com uma estratégia clara. Crie o conteúdo uma vez (principalmente Reels/TikTok) e distribua nas duas plataformas. O mesmo vídeo pode ir para Instagram Reels e TikTok com pequenas adaptações.</p>
<div class="alerta"><p><strong>Atenção:</strong> Vídeos do TikTok com a marca d'água do TikTok não performam bem quando repostados no Instagram. Use CapCut para exportar sem marca d'água ou grave versões limpas para cada plataforma.</p></div>
<div class="dica"><p><strong>Prioridade recomendada:</strong> Se você está começando agora, foque 80% do esforço no Instagram (onde a conversão em cliente é mais direta) e 20% no TikTok para crescimento de audiência.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
