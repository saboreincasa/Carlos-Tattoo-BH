  {mod:'MÓDULO 5 — VENDAS SEM PARECER VENDEDOR', aulas:[
    {t:'A arte de fechar sem pressionar', c:`
<div class="aula-tag">Módulo 5 · Aula 17</div>
<h1 class="aula-h1">A Arte de Fechar <span>sem Pressionar</span></h1>
<p class="aula-intro">Vender tatuagem premium não é sobre pressionar ou convencer. É sobre criar o ambiente certo onde o cliente se convence sozinho. Quando o processo está bem estruturado, o fechamento é natural.</p>
<h2 class="ah2">Por que tatuadores não gostam de "vender"</h2>
<p class="ap">Artistas em geral têm uma relação complicada com vendas. A palavra vende associada à manipulação, pressão ou desonestidade. Mas vender de forma ética é simplesmente ajudar o cliente a tomar a melhor decisão para ele. Quando você acredita profundamente no valor do que oferece, não precisa pressionar.</p>
<h2 class="ah2">As 4 objeções mais comuns e como superar</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>"Tá caro" — objeção de preço</h4><p>Primeiro: não justifique. Pergunte: "Caro em relação a quê?" Muitas vezes o cliente está comparando com trabalhos de nível diferente. Explique o que está incluso, a qualidade do material, o tempo de dedicação.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>"Vou pensar" — objeção de decisão</h4><p>"Claro! O que ainda está em dúvida? Às vezes consigo ajudar a esclarecer." Ou: "Entendo. Só aviso que minha agenda para essa data tem mais uma vaga — se precisar segurar, pode me falar hoje?"</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>"Vi mais barato em outro lugar" — objeção comparativa</h4><p>"Cada tatuador tem um posicionamento diferente. Meu trabalho é feito com materiais premium e X anos de especialização nesse estilo. O que pesa mais para você: preço ou resultado final?"</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>"Não tenho o valor agora" — objeção financeira</h4><p>"Entendo. Posso parcelar em X vezes no cartão sem juros. Ou posso reservar uma data no mês que vem quando o orçamento estiver mais folgado. Qual funciona melhor para você?"</p></div></div>
<h2 class="ah2">A técnica do silêncio</h2>
<p class="ap">Após apresentar o orçamento ou responder uma objeção, cale a boca. Sério. Quem fala primeiro depois de dar um preço perde a negociação. Deixe o silêncio trabalhar. O cliente vai processar, e muitas vezes a pressão natural do silêncio gera uma resposta positiva.</p>
<h2 class="ah2">Urgência legítima — como usar sem manipular</h2>
<ul class="checklist"><li>Agenda real com vagas limitadas: "Tenho 2 vagas este mês para projetos novos"</li><li>Material específico: "Preciso pedir essa tinta especial com uma semana de antecedência"</li><li>Lista de espera: "Tenho X pessoas na lista para essa data. Se confirmar hoje, fico feliz em reservar para você"</li></ul>
<div class="destaque"><p><strong>Princípio fundamental:</strong> Nunca crie urgência falsa. O cliente percebe e perde confiança. Urgência legítima (agenda realmente cheia, material a pedir) é poderosa. Urgência fabricada é manipulação que destrói relacionamento.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Como montar um portfólio que vende por você', c:`
<div class="aula-tag">Módulo 5 · Aula 18</div>
<h1 class="aula-h1">Como Montar um Portfólio <span>que Vende por Você</span></h1>
<p class="aula-intro">Seu portfólio trabalha 24 horas quando você dorme. Um portfólio bem construído filtra clientes, justifica preços e fecha vendas antes mesmo do primeiro contato. Aprenda a construir o seu estrategicamente.</p>
<h2 class="ah2">O erro mais comum de portfólio</h2>
<p class="ap">Mostrar tudo. Um portfólio com 500 fotos de todos os estilos, todos os níveis de trabalho, fotos de diferentes anos de qualidade variada não transmite especialização. Transmite generalismo — e generalistas cobram menos.</p>
<h2 class="ah2">Princípio da curadoria</h2>
<p class="ap">30 trabalhos excelentes > 300 trabalhos medianos. Seu portfólio deve mostrar apenas o top 10% do que você faz. Selecione com critério:</p>
<ul class="checklist"><li>Apenas trabalhos que você ficou orgulhoso ao finalizar</li><li>Apenas fotos com boa iluminação e foco correto</li><li>Preferencialmente trabalhos cicatrizados (resultado final) </li><li>Variedade de tamanho e região mas coerência de estilo</li><li>Nada com mais de 3-5 anos (a menos que seja um trabalho excepcional)</li></ul>
<h2 class="ah2">Portfólio físico: ainda vale?</h2>
<p class="ap">Para atendimentos presenciais, um portfólio físico bem produzido agrega muito à percepção de valor. Não precisa ser caro:</p>
<ul class="checklist"><li>Album fotográfico profissional (CEWE, Photobook) com suas melhores fotos impressas</li><li>Ou iPad dedicado com pasta de fotos organizada por estilo</li><li>Na recepção do estúdio para o cliente folhear enquanto espera</li><li>Atualizado a cada 3-6 meses com novos trabalhos</li></ul>
<h2 class="ah2">Portfólio digital: estrutura ideal</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Página inicial do Instagram/site</h4><p>Os 9-12 posts mais recentes e melhores. Esta é a primeira impressão digital.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Destaques organizados por estilo</h4><p>Realismo | Blackwork | Old School | Fine Line. Cliente que busca estilo específico encontra fácil.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Álbum no Google Fotos ou Behance</h4><p>Para enviar link quando o cliente pede para "ver mais trabalhos".</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Site próprio (opcional mas poderoso)</h4><p>Para tatuadores premium que querem posicionamento máximo. Um site bem feito cobra mais caro do que um que só tem Instagram.</p></div></div>
<div class="exemplo"><div class="exemplo-label">Como apresentar o portfólio no orçamento</div><p>"Vou te mandar o link com meu portfólio completo separado por estilo para você ter ideia do meu trabalho. Quando quiser conversar mais sobre o projeto, é só me chamar aqui 😊" — [link do álbum ou Instagram]</p></div>
<div class="destaque"><p><strong>Portfólio em construção:</strong> Se você está começando ou mudando de estilo, seja transparente. "Estou me especializando em realismo e esse tipo de projeto vai receber minha dedicação total" é melhor do que fingir um portfólio que não tem.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Depoimentos e prova social que convertem', c:`
<div class="aula-tag">Módulo 5 · Aula 19</div>
<h1 class="aula-h1">Depoimentos e Prova Social <span>que Convertem</span></h1>
<p class="aula-intro">Um depoimento autêntico vale mais que qualquer post de portfólio. As pessoas confiam mais em outras pessoas do que em marcas. Aprenda a coletar, usar e distribuir sua prova social de forma estratégica.</p>
<h2 class="ah2">Por que depoimentos são tão poderosos</h2>
<p class="ap">Quando alguém compra uma tatuagem premium (R$500+), existe um medo natural: "Vale a pena? O trabalho vai ficar como na foto?" Depoimentos de pessoas reais que passaram por isso e ficaram satisfeitas diminuem esse medo e facilitam a decisão.</p>
<h2 class="ah2">Como pedir o depoimento da forma certa</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Timing perfeito: logo após a sessão</h4><p>O cliente acabou de ver a tatuagem finalizada, está eufórico. Esse é o momento de pedir. "Você pode me mandar uma mensagenzinha sobre a experiência? Para mim é muito importante 🙏"</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Pergunte aspectos específicos</h4><p>"Me conta como foi o atendimento, se você se sentiu bem durante a sessão e o que achou do resultado." Depoimento específico é mais poderoso que "adorei, super indico".</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Facilite o processo</h4><p>Envie as perguntas por WhatsApp para o cliente responder no próprio aplicativo, quando quiser. Não force uma review no Google na hora — pode parecer pressão.</p></div></div>
<h2 class="ah2">Onde usar os depoimentos</h2>
<ul class="checklist"><li>Destaques do Instagram (crie um highlight "CLIENTES")</li><li>Stories periódicos (uma vez por semana está ótimo)</li><li>No orçamento: "Veja o que nossos clientes falam →"</li><li>No site (se tiver)</li><li>No Google Meu Negócio (peça avaliações lá também — aparecem no Google)</li></ul>
<h2 class="ah2">A prova social visual — mais poderosa ainda</h2>
<p class="ap">Uma foto de um cliente feliz mostrando a tatuagem nova, com uma legenda entusiasmada, vale mais que 10 depoimentos escritos. Incentive clientes a postarem e te marcarem:</p>
<ul class="checklist"><li>Peça para o cliente postar e te marcar assim que chegar em casa</li><li>"Se você postar sua tattoo e me marcar, repostarei nos meus stories com muito amor 🙏"</li><li>Crie um hashtag do seu estúdio (#centraltattoobh) e incentive seu uso</li><li>Reposte os conteúdos de clientes (sempre com autorização)</li></ul>
<div class="destaque"><p><strong>Google Meu Negócio:</strong> Se você ainda não criou seu perfil no Google Meu Negócio, faça isso hoje. Avaliações no Google aparecem quando alguém pesquisa "tatuador em [sua cidade]" e têm enorme impacto em novos clientes locais.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
  ]},
  {mod:'MÓDULO 6 — GESTÃO PROFISSIONAL DO NEGÓCIO', aulas:[
    {t:'Organizando o financeiro do estúdio com a planilha Central Tattoo', c:`
<div class="aula-tag">Módulo 6 · Aula 20</div>
<h1 class="aula-h1">Organizando o Financeiro <span>com a Planilha Central Tattoo</span></h1>
<p class="aula-intro">Um tatuador que não controla o financeiro é como um estúdio sem agenda — o caos é inevitável. Nessa aula você aprende a usar a planilha Central Tattoo para ter clareza total sobre dinheiro que entra, sai e sobra.</p>
<h2 class="ah2">Os 3 grandes erros financeiros de tatuadores</h2>
<ul class="checklist"><li><strong>Misturar conta pessoal e do estúdio:</strong> Você nunca sabe se o negócio dá lucro ou se está no prejuízo coberto pela sua conta pessoal.</li><li><strong>Não registrar todas as entradas:</strong> PIX de R$50 de retoque, dinheiro em espécie, permuta — tudo precisa ser registrado.</li><li><strong>Não separar pró-labore de lucro:</strong> Você é dono mas também é funcionário. Separe o que você paga a si mesmo (pró-labore) do que fica no negócio (lucro).</li></ul>
<h2 class="ah2">Configurando a planilha Central Tattoo — passo a passo</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Aba Financeiro: registre todas as entradas e saídas</h4><p>Toda sessão concluída vai como Receita. Toda compra de material vai como Custo Variável. Aluguel, energia, internet vão como Fixo. Marketing/Ads vai como Marketing.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Aba Calculadora: use para cada orçamento novo</h4><p>Antes de mandar qualquer orçamento, passe pela calculadora. Coloque horas estimadas, custo de materiais e margem desejada. Nunca mais vai cobrar abaixo do custo.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Aba Dashboard: revise toda semana</h4><p>Segunda-feira de manhã, 10 minutos olhando o Dashboard. Faturamento vs meta, sessões vs meta, ticket médio. Esses dados guiam as decisões da semana.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Aba Metas: defina no início de cada mês</h4><p>Meta de faturamento, número de sessões, ticket médio desejado. Com meta definida, você sabe no dia 15 se vai bater ou se precisa agir.</p></div></div>
<h2 class="ah2">Separação obrigatória: as 4 contas</h2>
<ul class="checklist"><li><strong>Conta Operacional:</strong> Onde o dinheiro do estúdio entra e sai (aluguel, materiais)</li><li><strong>Pró-labore:</strong> Transferência fixa mensal para sua conta pessoal (seu salário como artista)</li><li><strong>Reserva de emergência:</strong> 10% de tudo que entra. Meta: 3 meses de custos fixos</li><li><strong>Investimento/Crescimento:</strong> Para cursos, equipamentos novos, tráfego pago</li></ul>
<div class="exemplo"><div class="exemplo-label">Exemplo de distribuição mensal</div><p>Faturamento: R$8.000<br>(-) Custos do estúdio: R$2.500<br>(=) Resultado operacional: R$5.500<br>(-) Reserva de emergência (10%): R$800<br>(-) Investimento/crescimento (5%): R$400<br>(=) Disponível para pró-labore: R$4.300</p></div>
<div class="destaque"><p><strong>Regra de ouro:</strong> Nunca retire mais do que 70% do faturamento bruto como pró-labore. Os outros 30% são oxigênio do negócio — para emergências, crescimento e meses ruins.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Gestão de agenda: otimizando o tempo e maximizando faturamento', c:`
<div class="aula-tag">Módulo 6 · Aula 21</div>
<h1 class="aula-h1">Gestão de Agenda: <span>Otimizando Tempo e Faturamento</span></h1>
<p class="aula-intro">Agenda vazia é dinheiro perdido. Agenda muito cheia é burnout garantido. O equilíbrio ideal entre essas duas realidades é o que você vai aprender a encontrar nessa aula.</p>
<h2 class="ah2">Calculando a capacidade ideal da sua agenda</h2>
<p class="ap">Antes de tudo, seja honesto sobre seu limite saudável. Quantas horas de sessão você consegue fazer por dia sem perder qualidade ou se esgotar fisicamente? A maioria dos tatuadores responde: 6-8 horas. Mas na prática, 5-6 horas de tatuar é o limite para manter consistência.</p>
<ul class="checklist"><li>5h sessão/dia × 5 dias × 4 semanas = 100h/mês de tatuar</li><li>A 250/h: faturamento potencial = R$25.000/mês</li><li>A 350/h: faturamento potencial = R$35.000/mês</li><li><strong>Mas:</strong> você não vai preencher 100% da agenda todo mês. Calcule com 70-80%: 70-80h/mês é realista</li></ul>
<h2 class="ah2">Tipos de sessão e como balancear a agenda</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Sessões longas (4-8h)</h4><p>Maior faturamento por dia. Menor desgaste em troca de horário (clientes que fazem agendamento com antecedência). Ideal: 2-3 sessões longas por semana.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Sessões médias (2-3h)</h4><p>Equilíbrio entre faturamento e flexibilidade. Ideal para preencher gaps na agenda.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Sessões curtas (1-1,5h)</h4><p>Retoques, pequenas tattoos, ajustes. Útil para preencher buracos na agenda, mas cuidado: troca de cliente, preparação e limpeza consomem tempo desproporcional.</p></div></div>
<h2 class="ah2">Política de cancelamento e sinal</h2>
<p class="ap">Cancelamentos de última hora são o maior ladrão de faturamento de tatuadores. A solução é simples e definitiva:</p>
<ul class="checklist"><li>Sinal de 40-50% obrigatório para confirmar qualquer sessão</li><li>Sinal não reembolsável se cancelar com menos de 48h</li><li>Reagendamento permitido até 72h antes, uma vez por sessão</li><li>Cancelamento com mais de 72h: sinal transferido para a próxima sessão</li></ul>
<h2 class="ah2">Otimizando a agenda com lista de espera</h2>
<p class="ap">Mantenha sempre uma lista de espera com 5-10 pessoas que querem sessão. Quando houver um cancelamento, você tem clientes prontos para preencher. Isso minimiza agenda vazia.</p>
<div class="exemplo"><div class="exemplo-label">Comunicação da política no orçamento</div><p>"Para confirmar sua vaga, preciso de R$[valor] de sinal via PIX ([chave]). Em caso de cancelamento com menos de 48h, o sinal não é devolvido mas pode ser usado para reagendar. Cancelamentos com mais de 72h são remarcados sem custos. Funciona assim?"</p></div>
<div class="destaque"><p><strong>Dado importante:</strong> Tatuadores que exigem sinal têm taxa de no-show de apenas 5-8%, contra 30-40% dos que não exigem. A diferença no faturamento anual é enorme.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Estoque, fornecedores e controle de material', c:`
<div class="aula-tag">Módulo 6 · Aula 22</div>
<h1 class="aula-h1">Estoque, Fornecedores <span>e Controle de Material</span></h1>
<p class="aula-intro">Falta de material no meio de uma sessão é um pesadelo profissional. Comprar sem controle é jogar dinheiro fora. A gestão de estoque bem feita garante que você nunca fique sem o que precisa e otimiza seus custos.</p>
<h2 class="ah2">O custo real de material por sessão</h2>
<p class="ap">A maioria dos tatuadores não sabe exatamente quanto gasta de material por hora de sessão. Sem esse número, é impossível precificar corretamente. Vamos calcular:</p>
<ul class="checklist"><li>Agulhas (3-5 trocas por sessão): R$6-15</li><li>Tintas utilizadas (estimativa): R$15-50 dependendo do trabalho</li><li>Luvas (3-4 pares): R$3-6</li><li>Plástico, película, papel: R$8-15</li><li>Sabão, desinfetante: R$3-5</li><li><strong>Total por sessão de 4h: R$35-91</strong> — calcule o SEU número real</li></ul>
<h2 class="ah2">Estabelecendo ponto de reposição</h2>
<p class="ap">Para cada material, defina duas quantidades: estoque mínimo (quando você precisa pedir) e estoque ideal (o que você mantém normalmente).</p>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Estoque mínimo</h4><p>Para agulhas: mínimo 30 unidades. Para tinta preta: mínimo 3 frascos. Quando chegar nesse número, já acionar pedido.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Estoque ideal</h4><p>Para agulhas: 100+ unidades. Para tinta preta: 8-10 frascos. Isso dá conforto sem encalhar capital desnecessariamente.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Registro na planilha</h4><p>Use a aba Estoque da Central Tattoo. O sistema emite alerta automático quando chegar no mínimo.</p></div></div>
<h2 class="ah2">Fornecedores confiáveis em BH e online</h2>
<ul class="checklist"><li><strong>Distribuidores nacionais:</strong> Kola Tattoo, Inkcolor, Sunskin Brasil, Electric Ink</li><li><strong>Importados (para material premium):</strong> World Famous Ink, Eternal Ink, Fusion Ink</li><li><strong>Máquinas e acessórios:</strong> Evoke, Cheyenne (revendas autorizadas)</li><li><strong>Compra coletiva:</strong> Junte com outros tatuadores para comprar em quantidade e dividir frete/custo</li></ul>
<h2 class="ah2">Reduzindo custo sem reduzir qualidade</h2>
<ul class="checklist"><li>Compre tintas em quantidade (kit completo vs frascos avulsos = 20-30% mais barato)</li><li>Agulhas em caixa de 50 ou 100 (vs avulso)</li><li>Negocie prazo com fornecedor fixo (você traz volume, ele dá condição melhor)</li><li>Não economize em itens de biossegurança (luvas, plásticos, descarte) — nunca vale o risco</li></ul>
<div class="destaque"><p><strong>Inventário semestral:</strong> A cada 6 meses, faça um inventário completo do estoque. Some o valor de tudo que está guardado. Esse número entra no seu balanço como ativo — muitos tatuadores se surpreendem com quanto capital está parado em estoque.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
  ]},
  {mod:'MÓDULO 7 — CRESCIMENTO E EXPANSÃO', aulas:[
    {t:'Expansão: quando e como contratar outro tatuador', c:`
<div class="aula-tag">Módulo 7 · Aula 23</div>
<h1 class="aula-h1">Expansão: Quando e Como <span>Contratar Outro Tatuador</span></h1>
<p class="aula-intro">Chega um momento em que a agenda está cheia, você está recusando clientes e quer crescer. A solução é expansão — mas feita errado pode arruinar tudo que você construiu. Aqui está o guia completo.</p>
<h2 class="ah2">Sinais de que você está pronto para expandir</h2>
<ul class="checklist"><li>Agenda cheia com 3+ semanas de antecedência por pelo menos 3 meses seguidos</li><li>Você recusa clientes regularmente (não por falta de fit, mas por falta de agenda)</li><li>Financeiro estável com pelo menos 6 meses de reserva</li><li>Processos documentados: você consegue explicar como faz tudo para outro profissional?</li><li>Você tem um espaço físico que comporta mais de uma estação de trabalho</li></ul>
<h2 class="ah2">Modelo de parceria vs modelo de contratação</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Modelo de parceria (comissão)</h4><p>O tatuador parceiro usa sua estrutura e paga uma porcentagem (30-50%) das sessões que faz. Você não tem vínculo empregatício, o parceiro é autônomo. Mais simples juridicamente, menos custo fixo.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Modelo de aluguel de espaço</h4><p>O tatuador parceiro paga um aluguel fixo mensal pela estação. Independente de quanto ele fature, você recebe o aluguel. Mais previsível para você, mais risco para ele.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Modelo de contratação CLT</h4><p>Você contrata o tatuador como empregado, paga salário fixo. Mais custo (encargos, FGTS, INSS) mas mais controle. Recomendado apenas quando o volume é alto e consistente.</p></div></div>
<h2 class="ah2">Como escolher o tatuador certo para seu estúdio</h2>
<ul class="checklist"><li><strong>Estilo complementar, não idêntico:</strong> Você faz realismo? Contrate alguém excelente em fineline. Os clientes do estúdio terão mais opções.</li><li><strong>Perfil profissional alinhado:</strong> Pontualidade, cuidado com higiene, comunicação respeitosa com clientes.</li><li><strong>Valores similares:</strong> Um parceiro que corta preços ou trata mal cliente vai prejudicar sua marca.</li><li><strong>Portfólio honesto:</strong> Peça para ver fotos cicatrizadas, não apenas fotos recentes.</li></ul>
<h2 class="ah2">O contrato de parceria — o que não pode faltar</h2>
<ul class="checklist"><li>Percentual de divisão das receitas (clareza total)</li><li>Quem é responsável por quais custos</li><li>Regras de uso do espaço e materiais compartilhados</li><li>Cláusula de não-concorrência (distância mínima para abrir estúdio próprio)</li><li>Prazo de aviso para encerrar a parceria (recomendado: 60 dias)</li><li>Regras para clientes captados durante a parceria</li></ul>
<div class="destaque"><p><strong>Atenção jurídica:</strong> Antes de assinar qualquer parceria, consulte um contador ou advogado especializado em MEI/ME. Uma parceria mal documentada pode virar um problema trabalhista caro.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},
    {t:'Convenções de tatuagem: como usar para crescer', c:`
<div class="aula-tag">Módulo 7 · Aula 24</div>
<h1 class="aula-h1">Convenções de Tatuagem: <span>Como Usar para Crescer</span></h1>
<p class="aula-intro">Convenções são os maiores eventos de networking e vitrine do mercado de tatuagem. Participar estrategicamente pode alavancar sua carreira, expandir sua base de clientes e validar seu posicionamento premium.</p>
<h2 class="ah2">Por que convenções valem o investimento</h2>
<ul class="checklist"><li>Exposição para um público altamente qualificado (pessoas que amam tatuagem e estão dispostas a gastar)</li><li>Networking com outros artistas e possibilidade de parcerias</li><li>Premiações que valem ouro em marketing ("1º lugar em Realismo na Convenção X")</li><li>Aprendizado observando como artistas de referência trabalham e se posicionam</li><li>Clientes de outras cidades que depois seguem nas redes e fazem sessões presenciais</li></ul>
<h2 class="ah2">Como participar com estratégia</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Defina o objetivo principal</h4><p>Premiação (leve seu projeto mais impactante), networking (foque em conectar com artistas específicos), ou captação de clientes (prepare orçamentos rápidos e material de divulgação).</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Prepare o booth (sua estação)</h4><p>Visual coerente com sua marca. Display do portfólio. Cartões de visita premium. QR code para seu Instagram. A estação é uma extensão da sua identidade visual.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Documente tudo</h4><p>Fotos e vídeos do processo, do booth, dos prêmios, dos bastidores. Convenção gera conteúdo para 2-3 semanas nas redes sociais.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Follow-up pós-convenção</h4><p>Todas as pessoas que demonstraram interesse ou deixaram contato recebem uma mensagem em até 48h após o evento.</p></div></div>
<h2 class="ah2">Principais convenções em Minas Gerais e nacional</h2>
<ul class="checklist"><li>BH Tattoo Convention (anual em BH — a maior de MG)</li><li>São Paulo Tattoo Convention (a maior do Brasil)</li><li>Convenção de Tattoo de Uberlândia</li><li>Tattoo Week Rio</li><li>Convenções regionais das cidades do interior — às vezes mais rentáveis por menor concorrência</li></ul>
<h2 class="ah2">Participar como expositor ou como visitante?</h2>
<p class="ap">Nos primeiros 1-2 anos de carreira, vá como visitante. Observe, aprenda, conecte. A partir do 3º ano e com portfólio sólido, comece como expositor em convenções menores regionais antes de ir para as grandes.</p>
<div class="destaque"><p><strong>ROI de convenção:</strong> Uma convenção bem preparada pode gerar R$3.000-8.000 em faturamento no próprio evento + 10-20 leads qualificados para sessões futuras. Sem contar o valor de marca de eventuais premiações.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},

<div class="aula-tag">Módulo 8 · Aula 25</div>
<h1 class="aula-h1">Plano 90 Dias para <span>Dobrar o Ticket Médio</span></h1>
<p class="aula-intro">Com a mentalidade certa, as ferramentas, o processo e o plano que você aprendeu neste curso, aqui está o roteiro prático semana a semana para dobrar seu ticket médio em 90 dias.</p>
<h2 class="ah2">Mês 1 — Fundação (Semanas 1-4)</h2>
<ul class="checklist"><li><strong>Semana 1:</strong> Calcule seu preço real pela Calculadora Central Tattoo. Defina sua meta de ticket médio ideal.</li><li><strong>Semana 2:</strong> Refaça (ou construa) identidade visual — logo, paleta, templates do Canva para posts.</li><li><strong>Semana 3:</strong> Fotografe 10-15 melhores trabalhos com boa iluminação. Atualize o Instagram com novas fotos.</li><li><strong>Semana 4:</strong> Reescreva a bio do Instagram com posicionamento premium. Configure lista de espera no WhatsApp.</li></ul>
<h2 class="ah2">Mês 2 — Transição (Semanas 5-8)</h2>
<ul class="checklist"><li><strong>Semana 5:</strong> Comece testando preços 30-40% acima do atual para novos clientes. Documente as reações.</li><li><strong>Semana 6:</strong> Implante a política de sinal obrigatório. Comunique clientes que já têm sessões marcadas.</li><li><strong>Semana 7:</strong> Implante o fluxo de atendimento premium (scripts do Módulo 3). Responda a todos os leads com o processo novo.</li><li><strong>Semana 8:</strong> Avalie os resultados: quantos fecharam? Qual foi a objeção mais comum? Ajuste a comunicação.</li></ul>
<h2 class="ah2">Mês 3 — Consolidação (Semanas 9-12)</h2>
<ul class="checklist"><li><strong>Semana 9:</strong> Preços 60-80% acima do ponto de partida para todos os novos projetos.</li><li><strong>Semana 10:</strong> Publique os primeiros depoimentos coletados. Use nos stories e destaques.</li><li><strong>Semana 11:</strong> Analise o Dashboard da Central Tattoo — compare faturamento dos 3 meses. Calcule o crescimento real.</li><li><strong>Semana 12:</strong> Defina o próximo ciclo de 90 dias com metas maiores.</li></ul>
<h2 class="ah2">Indicadores para acompanhar semana a semana</h2>
<ul class="checklist"><li>Ticket médio das sessões fechadas</li><li>Taxa de fechamento de orçamentos (% de leads que viraram cliente)</li><li>Número de leads gerados pelo Instagram</li><li>Faturamento semanal vs meta semanal</li><li>Número de cancelamentos (redução com política de sinal)</li></ul>
<div class="destaque"><p><strong>Lembre-se:</strong> O objetivo não é ter agenda sempre lotada. É ter uma agenda com os clientes certos pagando o preço certo. Agenda com 15 sessões a R$600 (R$9.000) supera em tudo uma agenda com 25 sessões a R$300 (R$7.500). Menos trabalho, mais dinheiro, mais satisfação.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima →</button></div>`},

<div class="aula-tag">Módulo 8 · Aula 26</div>
<h1 class="aula-h1">Construindo sua Marca Pessoal <span>de Longo Prazo</span></h1>
<p class="aula-intro">Marcas pessoais fortes cobram mais, trabalham menos e têm clientes que os buscam ativamente. Este é o objetivo final de todo o posicionamento que você aprendeu: ser reconhecido como referência no seu estilo.</p>
<h2 class="ah2">O que é marca pessoal para um tatuador</h2>
<p class="ap">Marca pessoal é a soma de como as pessoas descrevem você quando você não está na sala. "Aquele que faz realismo incrível em BH." "O fineline artístico." "A especialista em botanical tattoo." Quando você tem uma marca pessoal forte, os clientes certos te encontram — não o contrário.</p>
<h2 class="ah2">Os 5 elementos de uma marca pessoal forte</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Estilo reconhecível</h4><p>Quando alguém vê um trabalho seu sem ver sua assinatura, deve reconhecer que é seu. Isso vem de especialização e consistência, não de variedade.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>História autêntica</h4><p>Por que você começou? O que te move? Qual é o significado de tatuar para você? Artistas com história autêntica conectam emocionalmente com o público.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Posicionamento claro de nicho</h4><p>Você não atende todo mundo. Você é a escolha óbvia para quem quer [estilo específico + perfil de cliente]. Quanto mais específico, mais autoridade.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Consistência ao longo do tempo</h4><p>Marca pessoal se constrói em anos, não em semanas. Consistência de qualidade, de estética e de valores ao longo do tempo é o que cria reputação irreversível.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Comunidade de fãs verdadeiros</h4><p>Não seguidores — fãs. Pessoas que acompanham seu trabalho, que comentam genuinamente, que esperam meses na sua lista de espera, que indicam amigos.</p></div></div>
<h2 class="ah2">Milestones de construção de marca</h2>
<ul class="checklist"><li><strong>Ano 1:</strong> Define o nicho, constrói portfólio consistente, alcança 1.000 seguidores reais engajados</li><li><strong>Ano 2-3:</strong> Primeiros 5.000 seguidores, agenda com lista de espera, primeiras premiações em convenção</li><li><strong>Ano 4-5:</strong> Referência local no seu estilo, 10.000+ seguidores, workshops e cursos como nova fonte de renda</li><li><strong>Ano 6+:</strong> Referência nacional, agenda fechada com 3-6 meses de antecedência, preços acima de R$500/hora</li></ul>
<h2 class="ah2">Diversificação de renda para tatuadores de marca forte</h2>
<p class="ap">A marca pessoal abre portas além das sessões. Quando você é reconhecido como referência, surgem:</p>
<ul class="checklist"><li>Workshops presenciais e online (ensinar o que você faz)</li><li>Cursos digitais no nicho de tatuagem</li><li>Conteúdo no YouTube/TikTok monetizado</li><li>Parcerias e endorsement com marcas de material</li><li>Consultoria para outros estúdios</li><li>Venda de arte digital e prints</li></ul>
<div style="background:linear-gradient(135deg,var(--d1),var(--d2));border:2px solid rgba(201,151,58,.3);border-radius:16px;padding:36px;text-align:center;margin-top:28px;">
  <div style="font-size:48px;margin-bottom:14px;">💼</div>
  <h3 style="font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:10px;">Parabéns! Você concluiu o curso completo.</h3>
  <p style="font-size:14px;color:var(--t2);line-height:1.8;margin-bottom:20px;">26 aulas. 8 módulos. Tudo que você precisa para ser o tatuador premium que sempre quis ser. Agora é executar.</p>
  <button onclick="concluirAula()" class="btn-concluir" style="padding:14px 28px;font-size:12px;letter-spacing:2px;">✓ CONCLUIR CURSO</button>
</div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)" disabled>Curso Concluído ✓</button></div>`},

// ── LÓGICA DO CURSO ──
function totalAulas(){return MODULOS.reduce((s,m)=>s+m.aulas.length,0);}

function getAula(idx){
  let n=0;
  for(const m of MODULOS){
    for(const a of m.aulas){
      if(n===idx) return {...a,mod:m.mod};
      n++;
    }
  }
  return null;
}

function renderSidebar(){
  const c=document.getElementById('sbModulos');
  c.innerHTML='';
  let n=0;
  MODULOS.forEach(mod=>{
    const div=document.createElement('div');
    const mt=document.createElement('div');
    mt.className='sb-mod-titulo';
    mt.textContent=mod.mod;
    div.appendChild(mt);
    mod.aulas.forEach((a,ai)=>{
      const idx=n;
      const done=(prog['done_'+CURSO_ID]||[]).includes(idx);
      const li=document.createElement('div');
      li.className='sb-aula'+(idx===aulaAtual?' active':'')+(done?' done':'');
      li.innerHTML=`<span class="sb-aula-num">${String(idx+1).padStart(2,'0')}</span><span class="sb-aula-nome">${a.t}</span>${done?'<span class="sb-aula-check">✓</span>':''}`;
      li.onclick=()=>irAula(idx);
      div.appendChild(li);
      n++;
    });
    c.appendChild(div);
  });
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  const pct=Math.round((done/total)*100);
  document.getElementById('progressoPct').textContent=pct+'%';
  document.getElementById('progressoFill').style.width=pct+'%';
}

function renderAula(){
  const a=getAula(aulaAtual);
  if(!a) return;
  document.getElementById('mhTitulo').textContent=a.t;
  document.getElementById('aulaContent').innerHTML=a.c;
  document.getElementById('btnAnt').disabled=aulaAtual===0;
  document.getElementById('btnProx').disabled=aulaAtual>=totalAulas()-1;
  window.scrollTo(0,0);
}

function irAula(idx){
  aulaAtual=idx;
  prog['aula_'+CURSO_ID]=idx;
  salvar();
  renderSidebar();
  renderAula();
}

function navAula(dir){
  const n=aulaAtual+dir;
  if(n>=0&&n<totalAulas()) irAula(n);
}

function concluirAula(){
  if(!prog['done_'+CURSO_ID]) prog['done_'+CURSO_ID]=[];
  if(!prog['done_'+CURSO_ID].includes(aulaAtual)) prog['done_'+CURSO_ID].push(aulaAtual);
  salvar();
  renderSidebar();
  if(aulaAtual<totalAulas()-1) navAula(1);
  else{alert('🎉 Parabéns! Você concluiu o curso Branding & Posicionamento Premium!');}
}

function salvar(){
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  prog[CURSO_ID]=Math.round((done/total)*100);
  localStorage.setItem('ct_progresso_'+(sessao?.email||''),JSON.stringify(prog));
}

renderSidebar();
renderAula();
</script>
</body>
</html>
