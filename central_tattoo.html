<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect,useCallback} = React;
const C={bg:'#FAF7F2',sur:'#FFFFFF',nav:'#EDE5D4',brd:'#DDD0BC',brdH:'#C8B896',

  acc:'#2C1A0C',acl:'#F5EDE0',
  grn:'#2D5E3A',grnb:'#EAF3EE',
  red:'#8B2018',redb:'#FAEAEA',
  amb:'#7A5E10',ambb:'#FBF5E0',
  blu:'#1A4070',blub:'#E8F0FA',
  pur:'#5B2D8A',purb:'#F0EAF8'};
const fmtR=v=>`R$ ${parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtD=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR'):'-';
const estilos=['Old School','New School','Realismo','Blackwork','Fineline','Aquarela','Tribal','Geométrico','Japonês','Neotradicional','Lettering','Pontilhismo','Cover-Up','Trash Polka'];
const origens=['Instagram','WhatsApp','Indicação','Google','TikTok','Passagem','Outro'];
const formasPgto=['Pix','Dinheiro','Cartão Débito','Cartão Crédito','Transferência'];

function useCRUD(key,def=[]){
  const load=()=>{try{const v=localStorage.getItem('ct_'+key);return v?JSON.parse(v):def;}catch(e){return def;}};
  const [data,setRaw]=useState(load);
  const set=v=>{const n=typeof v==='function'?v(data):v;setRaw(n);try{localStorage.setItem('ct_'+key,JSON.stringify(n));}catch(e){}};
  return[data,set];
}

const DEF_EST=[
  {id:1,material:'Tinta Preta',cat:'Tinta',qtd:5,unid:'frascos',custo:25,qtdMin:3,forn:''},
  {id:2,material:'Tinta Vermelha',cat:'Tinta',qtd:3,unid:'frascos',custo:28,qtdMin:2,forn:''},
  {id:3,material:'Tinta Azul',cat:'Tinta',qtd:3,unid:'frascos',custo:28,qtdMin:2,forn:''},
  {id:4,material:'Agulhas Liner 3RL',cat:'Agulhas',qtd:50,unid:'un',custo:2,qtdMin:20,forn:''},
  {id:5,material:'Agulhas Liner 5RL',cat:'Agulhas',qtd:50,unid:'un',custo:2,qtdMin:20,forn:''},
  {id:6,material:'Agulhas Shader 7M',cat:'Agulhas',qtd:30,unid:'un',custo:2.5,qtdMin:15,forn:''},
  {id:7,material:'Agulhas Magnum 15M',cat:'Agulhas',qtd:20,unid:'un',custo:3,qtdMin:10,forn:''},
  {id:8,material:'Película de Proteção',cat:'Proteção',qtd:100,unid:'metros',custo:1.5,qtdMin:30,forn:''},

  {id:10,material:'Luvas Nitrila M',cat:'Segurança',qtd:2,unid:'caixas',custo:35,qtdMin:1,forn:''},
  {id:11,material:'Vaselina',cat:'Consumível',qtd:10,unid:'potes',custo:8,qtdMin:5,forn:''},
  {id:12,material:'Sabão Antisséptico',cat:'Higiene',qtd:3,unid:'litros',custo:20,qtdMin:2,forn:''},
  {id:13,material:'Papel Toalha',cat:'Higiene',qtd:5,unid:'rolos',custo:5,qtdMin:3,forn:''},
  {id:14,material:'Spray Clorexidina',cat:'Higiene',qtd:4,unid:'frascos',custo:18,qtdMin:2,forn:''},
  {id:15,material:'Dermografo',cat:'Equipamento',qtd:2,unid:'un',custo:350,qtdMin:1,forn:''},
  {id:16,material:'Cartuchos Mistos',cat:'Agulhas',qtd:40,unid:'un',custo:4,qtdMin:20,forn:''},
  {id:17,material:'Green Soap',cat:'Higiene',qtd:2,unid:'litros',custo:30,qtdMin:1,forn:''},
  {id:18,material:'Papel Hectográfico',cat:'Consumível',qtd:100,unid:'folhas',custo:0.5,qtdMin:50,forn:''},
];
const DEF_PREC=estilos.map(e=>({estilo:e,p:'',m:'',g:'',mg:'',h:'',mn:'',r:'',c:''}));
const DEF_COM=[{id:1,prof:'Carlos Henrique',func:'Tatuador Principal',pct:60},{id:2,prof:'Profissional 2',func:'Tatuador',pct:55},{id:3,prof:'Recepcionista',func:'Atendimento',pct:30},{id:4,prof:'Body Piercer',func:'Piercing',pct:50}];
const DEF_META={mensal:5000,horasDia:8,diasMes:22,ticketMedio:600,txConv:30,metaSes:20,acomp:Array.from({length:12},()=>({meta:8000,real:0,mS:20,rS:0}))};

// ─── UI PRIMITIVES ───
function Bdg({c='neu',children}){
  const m={grn:{bg:C.grnb,cl:C.grn},red:{bg:C.redb,cl:C.red},amb:{bg:C.ambb,cl:C.amb},blu:{bg:C.blub,cl:C.blu},neu:{bg:'#F0E9DC',cl:C.tx2},pur:{bg:C.purb,cl:C.pur}};
  const s=m[c]||m.neu;
  return <span style={{background:s.bg,color:s.cl,fontSize:'11px',padding:'3px 9px',borderRadius:'12px',fontWeight:'600',display:'inline-block',whiteSpace:'nowrap',letterSpacing:'0.2px'}}>{children}</span>;
}
function Kpi({label,val,sub,c='neu'}){
  const m={grn:{brd:'#A8D5B5',hbg:C.grnb},red:{brd:'#F5B5B0',hbg:C.redb},amb:{brd:'#EDD090',hbg:C.ambb},blu:{brd:'#A0BDE0',hbg:C.blub},neu:{brd:C.brd,hbg:'#F7F2EB'}};
  const s=m[c]||m.neu;
  return <div style={{background:C.sur,border:`1px solid ${s.brd}`,borderRadius:'10px',overflow:'hidden'}}>
    <div style={{background:s.hbg,padding:'8px 14px',borderBottom:`1px solid ${s.brd}`}}>
      <p style={{margin:0,fontSize:'10px',color:C.tx3,letterSpacing:'0.8px',textTransform:'uppercase'}}>{label}</p>
    </div>
    <div style={{padding:'11px 14px'}}>
      <p style={{margin:0,fontSize:'20px',fontWeight:'600',color:C.txt,fontFamily:'Playfair Display,Georgia,serif'}}>{val}</p>
      {sub&&<p style={{margin:'3px 0 0',fontSize:'11px',color:C.tx2}}>{sub}</p>}
    </div>
  </div>;
}
function MH({title,sub,act}){
  return <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
    <div><h2 style={{fontSize:'22px',color:C.txt,margin:0}}>{title}</h2>{sub&&<p style={{margin:'4px 0 0',fontSize:'13px',color:C.tx2}}>{sub}</p>}</div>
    {act&&<div>{act}</div>}
  </div>;
}
function Inp({style:ex,...props}){return <input style={{width:'100%',padding:'8px 12px',border:`1px solid ${C.brd}`,borderRadius:'7px',fontSize:'13px',color:C.txt,background:C.sur,...ex}} {...props}/>;}
function Sel({children,style:ex,...props}){return <select style={{width:'100%',padding:'8px 12px',border:`1px solid ${C.brd}`,borderRadius:'7px',fontSize:'13px',color:C.txt,background:C.sur,...ex}} {...props}>{children}</select>;}
function FF({label,span,children}){
  return <div style={{marginBottom:'12px',gridColumn:span?`span ${span}`:undefined}}>
    <label style={{display:'block',fontSize:'10px',color:C.tx2,marginBottom:'4px',letterSpacing:'0.8px',textTransform:'uppercase',fontWeight:'600'}}>{label}</label>
    {children}
  </div>;
}
function Btn({children,onClick,c='pri',sz='md',full,style:ex}){
  const m={pri:{bg:C.acc,cl:'#FFF',brd:C.acc},out:{bg:'transparent',cl:C.acc,brd:C.brd},del:{bg:'#FFF',cl:C.red,brd:'#F5B5B0'},grn:{bg:C.grn,cl:'#FFF',brd:C.grn}};
  const s=m[c]||m.pri;
  const z={sm:{p:'4px 10px',fs:'11px'},md:{p:'8px 16px',fs:'13px'},lg:{p:'10px 22px',fs:'14px'}}[sz]||{p:'8px 16px',fs:'13px'};
  return <button onClick={onClick} style={{background:s.bg,color:s.cl,border:`1px solid ${s.brd}`,borderRadius:'7px',cursor:'pointer',fontFamily:'inherit',padding:z.p,fontSize:z.fs,width:full?'100%':undefined,...ex}}>{children}</button>;
}
function FC({children,onCancel,onSave,title}){
  return <div style={{background:'#FFFDF9',border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'20px',marginBottom:'16px',borderLeft:`3px solid ${C.acc}`}}>
    {title&&<h3 style={{margin:'0 0 14px',fontSize:'11px',color:C.acc,letterSpacing:'1px',textTransform:'uppercase'}}>{title}</h3>}
    {children}
    <div style={{display:'flex',gap:'8px',marginTop:'14px',paddingTop:'14px',borderTop:`1px solid ${C.brd}`}}>
      <Btn onClick={onSave}>Salvar</Btn>
      <Btn c="out" onClick={onCancel}>Cancelar</Btn>
    </div>
  </div>;
}
function Tbl({hdrs,rows,empty='Nenhum registro encontrado.'}){
  if(!rows.length) return <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'40px',textAlign:'center'}}><p style={{color:C.tx3,fontSize:'14px',margin:0}}>{empty}</p></div>;
  return <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',overflow:'hidden'}}>
    <div style={{overflowX:'auto'}}>
      <table>
        <thead><tr style={{background:'#F7F2EB'}}>{hdrs.map((h,i)=><th key={i} style={{padding:'9px 12px',textAlign:'left',fontSize:'10px',color:C.tx2,letterSpacing:'0.8px',textTransform:'uppercase',borderBottom:`1px solid ${C.brd}`,whiteSpace:'nowrap',fontWeight:'600'}}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((row,i)=><tr key={i} style={{background:i%2===0?C.sur:'#FDFAF6'}}>{row.map((cell,j)=><td key={j} style={{padding:'9px 12px',fontSize:'13px',borderBottom:`1px solid ${C.brd}`,verticalAlign:'middle'}}>{cell}</td>)}</tr>)}</tbody>
      </table>
    </div>
  </div>;
}
function GridForm({cols=3,children}){
  return <div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:'12px'}}>{children}</div>;
}

// ─── DASHBOARD ───
function Dashboard({kpis,agenda,metas}){
  const hoje=new Date().toISOString().split('T')[0];
  const prox=[...agenda].filter(a=>a.data>=hoje&&a.status!=='Cancelado').sort((a,b)=>a.data>b.data?1:-1).slice(0,6);
  const goals=[
    {l:'Faturamento Alvo',alvo:metas.mensal,real:kpis.rec,fA:fmtR(metas.mensal),fR:fmtR(kpis.rec)},
    {l:'Sessões Alvo',alvo:metas.metaSes||20,real:kpis.ses,fA:metas.metaSes||20,fR:kpis.ses},
    {l:'Ticket Médio Alvo',alvo:metas.ticketMedio,real:kpis.tick,fA:fmtR(metas.ticketMedio),fR:fmtR(kpis.tick)},
  ];
  return <div>
    <MH title="Dashboard" sub="Visão geral do negócio em tempo real"/>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:'12px',marginBottom:'14px'}}>
      <Kpi label="Faturamento Mês" val={fmtR(kpis.rec)} c="grn"/>
      <Kpi label="Despesas Mês" val={fmtR(kpis.desp)} c="red"/>
      <Kpi label="Lucro Líquido" val={fmtR(kpis.luc)} sub={`Margem: ${kpis.marg}%`} c={kpis.luc>=0?'grn':'red'}/>
      <Kpi label="Sessões Concluídas" val={kpis.ses} c="blu"/>
      <Kpi label="Clientes Cadastrados" val={kpis.cli}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:'12px',marginBottom:'20px'}}>
      <Kpi label="Ticket Médio" val={fmtR(kpis.tick)} c="amb"/>
      <Kpi label="Margem Lucro" val={`${kpis.marg}%`}/>
      <Kpi label="Cancelamentos" val={kpis.canc} c={kpis.canc>0?'red':'neu'}/>
      <Kpi label="VIP / Fidelizados" val={kpis.fid} c="grn"/>
      <Kpi label="Valor em Estoque" val={fmtR(kpis.est)}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:'16px'}}>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'13px',color:C.acc,margin:'0 0 12px',textTransform:'uppercase',letterSpacing:'0.6px'}}>📅 Próximas Sessões</h3>
        {prox.length===0?<p style={{color:C.tx3,fontSize:'13px'}}>Nenhuma sessão agendada.</p>:<table>
          <thead><tr>{['Data','Hora','Cliente','Estilo','Valor','Status'].map(h=><th key={h} style={{padding:'5px 8px',textAlign:'left',fontSize:'10px',color:C.tx3,borderBottom:`1px solid ${C.brd}`,textTransform:'uppercase',letterSpacing:'0.5px'}}>{h}</th>)}</tr></thead>
          <tbody>{prox.map((s,i)=><tr key={i}><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`,fontSize:'12px'}}>{fmtD(s.data)}</td><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`,fontSize:'12px'}}>{s.hora}</td><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`,fontSize:'12px',fontWeight:'500'}}>{s.cliente}</td><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`,fontSize:'12px'}}>{s.estilo}</td><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`,fontSize:'12px',color:C.grn,fontWeight:'600'}}>{fmtR(s.valor)}</td><td style={{padding:'6px 8px',borderBottom:`1px solid ${C.brd}`}}><Bdg c={{Confirmado:'grn',Aguardando:'amb',Cancelado:'red',Concluído:'blu',Remarcado:'neu'}[s.status]||'neu'}>{s.status}</Bdg></td></tr>)}</tbody>
        </table>}
      </div>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'13px',color:C.acc,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'0.6px'}}>🎯 Metas do Mês</h3>
        {goals.map((g,i)=>{const p=g.alvo>0?Math.min(100,Math.round(g.real/g.alvo*100)):0;return <div key={i} style={{marginBottom:'14px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}><span style={{fontSize:'12px',color:C.tx2}}>{g.l}</span><span style={{fontSize:'11px',color:C.tx3}}>{g.fR} / {g.fA}</span></div>
          <div style={{background:'#F0E9DC',borderRadius:'3px',height:'7px',overflow:'hidden'}}><div style={{background:p>=100?C.grn:p>=60?C.amb:C.red,height:'100%',width:`${p}%`,borderRadius:'3px',transition:'width 0.4s ease'}}/></div>
          <p style={{margin:'2px 0 0',fontSize:'10px',color:C.tx3}}>{p}% atingido</p>
        </div>;})}
      </div>
    </div>
  </div>;
}

// ─── AGENDA ───
function Agenda({agenda,setAgenda}){
  const [sh,setSh]=useState(false);const [eid,setEid]=useState(null);
  const ef={data:'',hora:'',cliente:'',tel:'',estilo:'',status:'Confirmado',valor:'',saldo:'',dur:'',local:'',obs:''};
  const [f,setF]=useState(ef);
  const sc={Confirmado:'grn',Aguardando:'amb',Cancelado:'red',Concluído:'blu',Remarcado:'neu'};
  const openN=()=>{setF(ef);setEid(null);setSh(true);};
  const openE=a=>{setF({...a});setEid(a.id);setSh(true);};
  const save=()=>{if(!f.data||!f.cliente){alert('Preencha Data e Cliente');return;}if(eid){setAgenda(ag=>ag.map(a=>a.id===eid?{...f,id:eid}:a));}else{setAgenda(ag=>[...ag,{...f,id:Date.now()}]);}setSh(false);};
  const del=id=>{if(window.confirm('Excluir este agendamento?'))setAgenda(ag=>ag.filter(a=>a.id!==id));};
  const sorted=[...agenda].sort((a,b)=>b.data>a.data?1:-1);
  return <div>
    <MH title="Agenda de Sessões" sub="Gerencie agendamentos, horários e valores" act={<Btn onClick={openN}>+ Nova Sessão</Btn>}/>
    {sh&&<FC title={eid?'Editar Sessão':'Nova Sessão'} onSave={save} onCancel={()=>setSh(false)}>
      <GridForm cols={3}>
        <FF label="Data *"><Inp type="date" value={f.data} onChange={e=>setF({...f,data:e.target.value})}/></FF>
        <FF label="Hora"><Inp type="time" value={f.hora} onChange={e=>setF({...f,hora:e.target.value})}/></FF>
        <FF label="Status"><Sel value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{['Confirmado','Aguardando','Cancelado','Concluído','Remarcado'].map(s=><option key={s}>{s}</option>)}</Sel></FF>
        <FF label="Cliente *"><Inp value={f.cliente} onChange={e=>setF({...f,cliente:e.target.value})} placeholder="Nome do cliente"/></FF>
        <FF label="Telefone"><Inp value={f.tel} onChange={e=>setF({...f,tel:e.target.value})} placeholder="(00) 00000-0000"/></FF>
        <FF label="Estilo"><Sel value={f.estilo} onChange={e=>setF({...f,estilo:e.target.value})}><option value="">Selecione...</option>{estilos.map(s=><option key={s}>{s}</option>)}</Sel></FF>
        <FF label="Valor Total (R$)"><Inp type="number" value={f.valor} onChange={e=>setF({...f,valor:e.target.value})}/></FF>
        <FF label="Saldo (R$)"><Inp type="number" value={f.saldo} onChange={e=>setF({...f,saldo:e.target.value})}/></FF>
        <FF label="Duração"><Inp value={f.dur} onChange={e=>setF({...f,dur:e.target.value})} placeholder="Ex: 3h"/></FF>
        <FF label="Local"><Inp value={f.local} onChange={e=>setF({...f,local:e.target.value})} placeholder="Estúdio"/></FF>
        <FF label="Observações" span={2}><Inp value={f.obs} onChange={e=>setF({...f,obs:e.target.value})}/></FF>
      </GridForm>
    </FC>}
    <Tbl hdrs={['Data','Hora','Cliente','Telefone','Estilo','Status','Valor Total','Saldo','Ações']} empty="Nenhuma sessão. Clique em + Nova Sessão."
      rows={sorted.map(a=>[fmtD(a.data),a.hora,<strong>{a.cliente}</strong>,a.tel||'-',a.estilo||'-',<Bdg c={sc[a.status]||'neu'}>{a.status}</Bdg>,<span style={{color:C.grn,fontWeight:'600'}}>{fmtR(a.valor)}</span>,fmtR(a.saldo),<div style={{display:'flex',gap:'5px'}}><Btn sz="sm" c="out" onClick={()=>openE(a)}>Editar</Btn><Btn sz="sm" c="del" onClick={()=>del(a.id)}>Excluir</Btn></div>])}
    />
  </div>;
}

// ─── CLIENTES CRM ───
function Clientes({clientes,setClientes}){
  const [sh,setSh]=useState(false);const [eid,setEid]=useState(null);const [srch,setSrch]=useState('');
  const ef={nome:'',tel:'',email:'',nasc:'',cidade:'',tattoos:'',status:'Ativo',ultimoCont:'',proxRet:'',estPref:'',indicado:'',totalGasto:'',nps:'',insta:'',origem:''};
  const [f,setF]=useState(ef);
  const sc={Ativo:'grn',VIP:'amb',Fidelizado:'blu',Inativo:'neu',Novo:'pur'};
  const openN=()=>{setF(ef);setEid(null);setSh(true);};
  const openE=c=>{setF({...c});setEid(c.id);setSh(true);};
  const save=()=>{if(!f.nome){alert('Preencha o nome');return;}if(eid){setClientes(cs=>cs.map(c=>c.id===eid?{...f,id:eid}:c));}else{setClientes(cs=>[...cs,{...f,id:Date.now()}]);}setSh(false);};
  const del=id=>{if(window.confirm('Excluir cliente?'))setClientes(cs=>cs.filter(c=>c.id!==id));};
  const fil=clientes.filter(c=>!srch||c.nome.toLowerCase().includes(srch.toLowerCase())||c.tel?.includes(srch)||c.cidade?.toLowerCase().includes(srch.toLowerCase()));
  return <div>
    <MH title="CRM de Clientes" sub="Cadastro, histórico de tattoos e fidelização"
      act={<div style={{display:'flex',gap:'8px'}}><Inp style={{width:'200px'}} placeholder="Buscar por nome, tel..." value={srch} onChange={e=>setSrch(e.target.value)}/><Btn onClick={openN}>+ Novo Cliente</Btn></div>}/>
    {sh&&<FC title={eid?'Editar Cliente':'Novo Cliente'} onSave={save} onCancel={()=>setSh(false)}>
      <GridForm cols={3}>
        <FF label="Nome *"><Inp value={f.nome} onChange={e=>setF({...f,nome:e.target.value})}/></FF>
        <FF label="Telefone"><Inp value={f.tel} onChange={e=>setF({...f,tel:e.target.value})} placeholder="(00) 00000-0000"/></FF>
        <FF label="E-mail"><Inp type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></FF>

// ─── FOLLOW-UP ───
function FollowUp({clientes,agenda}){
  const hoje=new Date();
  const al=clientes.map(c=>{
    const last=[...agenda].filter(a=>a.cliente===c.nome&&a.status==='Concluído').sort((a,b)=>b.data>a.data?1:-1)[0];
    const ld=last?new Date(last.data+'T12:00'):(c.ultimoCont?new Date(c.ultimoCont+'T12:00'):null);
    const days=ld?Math.floor((hoje-ld)/(864e5)):null;
    const cor=days===null?'neu':days>180?'red':days>90?'amb':days>30?'blu':'grn';
    const al2=days===null?'Sem histórico':days>180?'⚠️ Crítico (180d+)':days>90?'🔔 Retorno (90d+)':days>30?'📆 Atenção (30d+)':'✅ Recente';
    return {...c,days,cor,al2,ldStr:ld?ld.toLocaleDateString('pt-BR'):'-'};
  }).filter(x=>x.days===null||x.days>30).sort((a,b)=>(b.days||0)-(a.days||0));
  return <div>
    <MH title="Follow-Up Automático" sub="Alertas de clientes que precisam de atenção"/>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:'12px',marginBottom:'18px'}}>
      <Kpi label="Críticos (+180d)" val={al.filter(a=>a.days>180).length} c="red"/>
      <Kpi label="Retorno necessário" val={al.filter(a=>a.days>90&&a.days<=180).length} c="amb"/>
      <Kpi label="Atenção (30-90d)" val={al.filter(a=>a.days>30&&a.days<=90).length} c="blu"/>
      <Kpi label="Sem histórico" val={al.filter(a=>a.days===null).length}/>
    </div>
    <Tbl hdrs={['Cliente','Telefone','Último Contato','Dias Passados','Alerta','Ação Sugerida']} empty="✅ Todos os clientes estão em dia!"
      rows={al.map(a=>[<strong>{a.nome}</strong>,a.tel||'-',a.ldStr,a.days!==null?`${a.days} dias`:'-',<Bdg c={a.cor}>{a.al2}</Bdg>,a.days>180?'Entrar em contato urgente':a.days>90?'Enviar mensagem de retorno':a.days>30?'Agendar retorno':'Verificar situação'])}
    />
  </div>;
}

      <Kpi label="Margem Líquida" val={`${ml}%`}/>

    </div>
    <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px',marginBottom:'16px'}}>
      <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 12px',textTransform:'uppercase',letterSpacing:'0.8px'}}>📊 DRE — Demonstrativo de Resultado</h3>
      <table style={{maxWidth:'480px'}}>
        {[['(+) Receita Bruta',rec,false,false],['(-) Materiais e Insumos',mat,true,false],['(-) Comissões',com2,true,false],['(=) Lucro Bruto',lb,false,true],['(-) Aluguel / Infraestrutura',alg,true,false],['(-) Marketing / Tráfego',mkt,true,false],['(-) Outros Fixos',oth,true,false],['(=) Lucro Líquido',ll,false,true],['(%) Margem Líquida',`${ml}%`,false,true,true]].map(([l,v,neg,bold,str],i)=><tr key={i} style={{background:bold?'#F7F2EB':i%2===0?C.sur:'#FDFAF6'}}>

// ─── CALCULADORA ───
function Calculadora(){
  const [p,setP]=useState({h:3,vh:80,mat:50,tam:2,comp:2,cov:0,col:0,reg:0,marg:40});
  const r=useMemo(()=>{
    const base=p.h*p.vh;
    const mt=[1,1,1.3,1.6,2.5][p.tam]||1;
    const mc=[1,1,1.4,1.8][p.comp]||1;
    let sub=(base+parseFloat(p.mat))*mt*mc;
    if(p.cov)sub*=1.4;if(p.col)sub*=1.3;if(p.reg)sub*=1.2;
    const pm=sub/(1-p.marg/100);const pp=pm*1.2;
    return{base,mt,mc,sub,pm,pp,lm:pm-sub,lp:pp-sub};
  },[p]);
  const sl=(lbl,k,mn,mx,unit='')=><div style={{marginBottom:'15px'}}>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
      <label style={{fontSize:'13px',color:C.tx2}}>{lbl}</label>
      <span style={{fontSize:'14px',fontWeight:'600',color:C.txt,fontFamily:'Playfair Display,serif'}}>{p[k]}{unit}</span>
    </div>
    <input type="range" min={mn} max={mx} step={k==='mat'?10:1} value={p[k]} onChange={e=>setP({...p,[k]:parseFloat(e.target.value)})} style={{width:'100%',accentColor:C.acc,height:'4px'}}/>
  </div>;
  return <div>
    <MH title="Calculadora de Preço Premium" sub="Precifique corretamente cada projeto sem perder margem"/>

        {sl('Horas estimadas de trabalho','h',1,20)}
        {sl('Valor da sua hora (R$)','vh',50,700)}
        {sl('Custo de material (R$)','mat',0,500)}
        {sl('Margem de lucro desejada','marg',10,80,'%')}
        <div style={{marginBottom:'15px'}}>
          <label style={{fontSize:'13px',color:C.tx2,display:'block',marginBottom:'6px'}}>Tamanho do Projeto</label>
          <div style={{display:'flex',gap:'6px'}}>
            {[{v:1,l:'Pequeno'},{v:2,l:'Médio'},{v:3,l:'Grande'},{v:4,l:'Manga'}].map(o=><button key={o.v} onClick={()=>setP({...p,tam:o.v})} style={{flex:1,padding:'8px 4px',border:`1px solid ${p.tam===o.v?C.acc:C.brd}`,background:p.tam===o.v?C.acc:C.sur,color:p.tam===o.v?'#FFF':C.txt,borderRadius:'7px',cursor:'pointer',fontSize:'12px',fontFamily:'inherit',transition:'all 0.15s'}}>{o.l}</button>)}
          </div>
        </div>
        <div style={{marginBottom:'15px'}}>
          <label style={{fontSize:'13px',color:C.tx2,display:'block',marginBottom:'6px'}}>Nível de Complexidade</label>
          <div style={{display:'flex',gap:'6px'}}>
            {[{v:1,l:'Simples'},{v:2,l:'Médio'},{v:3,l:'Complexo'}].map(o=><button key={o.v} onClick={()=>setP({...p,comp:o.v})} style={{flex:1,padding:'8px',border:`1px solid ${p.comp===o.v?C.acc:C.brd}`,background:p.comp===o.v?C.acc:C.sur,color:p.comp===o.v?'#FFF':C.txt,borderRadius:'7px',cursor:'pointer',fontSize:'12px',fontFamily:'inherit',transition:'all 0.15s'}}>{o.l}</button>)}
          </div>
        </div>

        </div>

            </div>

            </div>
          </div>
        </div>
        <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
          <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 10px',textTransform:'uppercase',letterSpacing:'0.6px'}}>💡 Referência de Mercado — BH 2026</h3>

// ─── METAS ───
function Metas({metas,setMetas}){
  const ms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const ses=metas.ticketMedio>0?Math.ceil(metas.mensal/metas.ticketMedio):0;
  const hn=ses>0?(ses*3/metas.diasMes).toFixed(1):0;
  const ln=metas.txConv>0?Math.ceil(ses/(metas.txConv/100)):0;
  const fp=metas.horasDia*metas.diasMes/3*metas.ticketMedio;
  const ac=metas.acomp||Array.from({length:12},()=>({meta:8000,real:0,mS:20,rS:0}));
  const upd=(mi,k,v)=>{const na=[...ac];if(!na[mi])na[mi]={meta:8000,real:0,mS:20,rS:0};na[mi]={...na[mi],[k]:parseFloat(v)||0};setMetas({...metas,acomp:na});};
  const setM=(k,v)=>setMetas({...metas,[k]:parseFloat(v)||0});
  return <div>
    <MH title="Metas e Previsão de Faturamento" sub="Planejamento, objetivos e acompanhamento mensal"/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px',marginBottom:'18px'}}>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'0.8px'}}>🎯 Parâmetros das Metas</h3>
        {[{l:'Meta de faturamento mensal (R$)',k:'mensal'},{l:'Horas disponíveis por dia',k:'horasDia'},{l:'Dias trabalhados por mês',k:'diasMes'},{l:'Ticket médio por sessão (R$)',k:'ticketMedio'},{l:'Taxa de conversão de leads (%)',k:'txConv'}].map(fi=><div key={fi.k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',gap:'10px'}}>
          <label style={{fontSize:'13px',color:C.tx2,flex:1}}>{fi.l}</label>
          <input type="number" value={metas[fi.k]} onChange={e=>setM(fi.k,e.target.value)} style={{width:'110px',padding:'6px 10px',border:`1px solid ${C.brd}`,borderRadius:'7px',fontSize:'13px',textAlign:'right',fontFamily:'Playfair Display,serif',color:C.acc,fontWeight:'600'}}/>
        </div>)}
      </div>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'0.8px'}}>📊 Projeção Calculada</h3>
        {[{l:'Sessões necessárias por mês',v:ses},{l:'Horas de trabalho/dia necessárias',v:`${hn}h`},{l:'Leads necessários para a meta',v:ln},{l:'Faturamento máximo possível',v:fmtR(fp)},{l:'Folga de capacidade diária',v:`${Math.max(0,metas.horasDia-parseFloat(hn)).toFixed(1)}h`}].map((r,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:`1px solid ${C.brd}`,fontSize:'13px'}}>
          <span style={{color:C.tx2}}>{r.l}</span>
          <strong style={{color:C.acc,fontFamily:'Playfair Display,serif'}}>{r.v}</strong>
        </div>)}
      </div>
    </div>
    <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',overflow:'hidden'}}>
      <div style={{padding:'14px 18px',borderBottom:`1px solid ${C.brd}`,background:'#F7F2EB'}}>
        <h3 style={{margin:0,fontSize:'13px',color:C.acc}}>📅 Acompanhamento Mensal 2026</h3>
      </div>
      <div style={{overflowX:'auto'}}>
        <table>
          <thead><tr><th style={{background:'#F7F2EB',padding:'8px 12px',textAlign:'left',fontSize:'10px',color:C.tx2,borderBottom:`1px solid ${C.brd}`,textTransform:'uppercase',letterSpacing:'0.5px',minWidth:'160px'}}>Indicador</th>
            {ms.map(m=><th key={m} style={{background:'#F7F2EB',padding:'8px 6px',textAlign:'center',fontSize:'10px',color:C.tx2,borderBottom:`1px solid ${C.brd}`,textTransform:'uppercase',minWidth:'72px'}}>{m}</th>)}
            <th style={{background:'#F7F2EB',padding:'8px 10px',textAlign:'center',fontSize:'10px',color:C.tx2,borderBottom:`1px solid ${C.brd}`}}>Total</th>
          </tr></thead>
          <tbody>
            {[{l:'Meta Fat. (R$)',k:'meta',fmt:v=>fmtR(v),edit:true},{l:'Real Fat. (R$)',k:'real',fmt:v=>fmtR(v),edit:true},{l:'% Atingido',k:null},{l:'Meta Sessões',k:'mS',fmt:v=>v,edit:true},{l:'Sessões Reais',k:'rS',fmt:v=>v,edit:true}].map((row,ri)=><tr key={ri} style={{background:ri%2===0?C.sur:'#FDFAF6'}}>
              <td style={{padding:'7px 12px',fontSize:'12px',borderBottom:`1px solid ${C.brd}`,fontWeight:'500',color:C.txt}}>{row.l}</td>
              {ms.map((_,mi)=><td key={mi} style={{padding:'3px 4px',borderBottom:`1px solid ${C.brd}`,textAlign:'center'}}>
                {row.edit?<input type="number" value={ac[mi]?.[row.k]||0} onChange={e=>upd(mi,row.k,e.target.value)} style={{width:'65px',padding:'4px 5px',border:`1px solid ${C.brd}`,borderRadius:'4px',fontSize:'11px',textAlign:'center'}}/>:
                (()=>{const p=ac[mi]?.meta>0?Math.round((ac[mi]?.real||0)/ac[mi].meta*100):0;return<span style={{fontSize:'11px',fontWeight:'600',color:p>=100?C.grn:p>=70?C.amb:C.red}}>{p}%</span>;})()}
              </td>)}
              <td style={{padding:'7px 10px',fontSize:'12px',borderBottom:`1px solid ${C.brd}`,textAlign:'center',fontWeight:'600',color:C.acc}}>
                {row.k==='meta'||row.k==='real'?fmtR(ac.reduce((s,m)=>s+(m?.[row.k]||0),0)):row.k==='mS'||row.k==='rS'?ac.reduce((s,m)=>s+(m?.[row.k]||0),0):''}
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  </div>;
}

        <FF label="Serviço"><Inp value={f.servico} onChange={e=>setF({...f,servico:e.target.value})}/></FF>
        <FF label="Valor do Serviço (R$) *"><Inp type="number" value={f.valServ} onChange={e=>setF({...f,valServ:e.target.value})}/></FF>
        <FF label="Status do Pagamento"><Sel value={f.stPgto} onChange={e=>setF({...f,stPgto:e.target.value})}><option>Pendente</option><option>Pago</option></Sel></FF>

        Comissão calculada: <strong>{fmtR((parseFloat(f.valServ)*(comCfg.find(c=>c.prof===f.prof)?.pct||0))/100)}</strong> ({comCfg.find(c=>c.prof===f.prof)?.pct||0}%)
      </div>}

        <FF label="Plataforma"><Sel value={f.plat} onChange={e=>setF({...f,plat:e.target.value})}><option value="">Selecione...</option>{['Instagram Ads','Facebook Ads','Google Ads','TikTok Ads','Orgânico'].map(s=><option key={s}>{s}</option>)}</Sel></FF>
        <FF label="Tipo de Campanha"><Sel value={f.tipo} onChange={e=>setF({...f,tipo:e.target.value})}><option value="">Selecione...</option>{['Geração de Leads','Engajamento','Alcance','Tráfego','Conversão'].map(s=><option key={s}>{s}</option>)}</Sel></FF>
        <FF label="Verba (R$)"><Inp type="number" value={f.verba} onChange={e=>setF({...f,verba:e.target.value})}/></FF>
        <FF label="Impressões"><Inp type="number" value={f.impressoes} onChange={e=>setF({...f,impressoes:e.target.value})}/></FF>
        <FF label="Cliques"><Inp type="number" value={f.cliques} onChange={e=>setF({...f,cliques:e.target.value})}/></FF>
        <FF label="Leads Gerados"><Inp type="number" value={f.leads} onChange={e=>setF({...f,leads:e.target.value})}/></FF>
        <FF label="Convertidos"><Inp type="number" value={f.conv} onChange={e=>setF({...f,conv:e.target.value})}/></FF>
        <FF label="Faturamento Gerado (R$)"><Inp type="number" value={f.fat} onChange={e=>setF({...f,fat:e.target.value})}/></FF>
        <FF label="Observações" span={3}><Inp value={f.obs} onChange={e=>setF({...f,obs:e.target.value})}/></FF>

      rows={mkt.map(m=>{const roi=m.verba&&parseFloat(m.verba)>0?((parseFloat(m.fat||0)-parseFloat(m.verba))/parseFloat(m.verba)*100).toFixed(0):null;return[m.mes||'-',m.plat||'-',m.tipo||'-',m.verba?fmtR(m.verba):'-',m.impressoes||'-',m.cliques||'-',m.leads||'-',m.conv||'-',m.fat?fmtR(m.fat):'-',roi!==null?<span style={{color:parseFloat(roi)>=0?C.grn:C.red,fontWeight:'600'}}>{roi}%</span>:'-',<div style={{display:'flex',gap:'5px'}}><Btn sz="sm" c="out" onClick={()=>openE(m)}>Editar</Btn><Btn sz="sm" c="del" onClick={()=>del(m.id)}>Excluir</Btn></div>];})}
    />

}

// ─── RELATÓRIO ───
function Relatorio({kpis,fin,leads,agenda}){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ms,setMs]=useState(new Date().getMonth());
  const estC={};agenda.forEach(a=>{if(a.estilo)estC[a.estilo]=(estC[a.estilo]||0)+1;});
  const topEst=Object.entries(estC).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const origC={};leads.forEach(l=>{if(l.origem)origC[l.origem]=(origC[l.origem]||0)+1;});
  const origArr=Object.entries(origC).sort((a,b)=>b[1]-a[1]);
  const totLd=origArr.reduce((s,[,c])=>s+c,0);
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
      <div><h2 style={{fontSize:'22px',color:C.txt,margin:0}}>Relatório de Performance</h2><p style={{margin:'4px 0 0',fontSize:'13px',color:C.tx2}}>Análise do negócio e visão consolidada</p></div>
      <select value={ms} onChange={e=>setMs(parseInt(e.target.value))} style={{padding:'8px 12px',border:`1px solid ${C.brd}`,borderRadius:'7px',fontSize:'13px',color:C.txt,background:C.sur}}>
        {meses.map((m,i)=><option key={i} value={i}>{m} 2026</option>)}
      </select>
    </div>
    <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderLeft:`4px solid ${C.acc}`,borderRadius:'10px',padding:'14px 18px',marginBottom:'16px'}}>
      <h3 style={{margin:0,color:C.acc,fontSize:'14px'}}>📅 Período: {meses[ms]} 2026 — dados acumulados cadastrados no sistema</h3>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'12px',marginBottom:'18px'}}>
      <Kpi label="Faturamento" val={fmtR(kpis.rec)} c="grn"/>
      <Kpi label="Despesas" val={fmtR(kpis.desp)} c="red"/>
      <Kpi label="Lucro" val={fmtR(kpis.luc)} c={kpis.luc>=0?'grn':'red'}/>
      <Kpi label="Sessões" val={kpis.ses} c="blu"/>
      <Kpi label="Leads" val={leads.length}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'0.8px'}}>🏆 Top Estilos</h3>
        {topEst.length===0?<p style={{color:C.tx3,fontSize:'13px'}}>Nenhum dado disponível ainda.</p>:topEst.map(([est,cnt],i)=>{const max=topEst[0][1];const pct=Math.round(cnt/max*100);return<div key={i} style={{marginBottom:'11px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}><span style={{fontSize:'13px',color:C.txt,fontWeight:'500'}}>{est}</span><span style={{fontSize:'11px',color:C.tx3}}>{cnt} sessão(ões)</span></div>
          <div style={{background:'#F0E9DC',borderRadius:'4px',height:'7px',overflow:'hidden'}}><div style={{background:C.acc,height:'100%',width:`${pct}%`,borderRadius:'4px'}}/></div>
        </div>;})}
      </div>
      <div style={{background:C.sur,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'18px'}}>
        <h3 style={{fontSize:'12px',color:C.acc,margin:'0 0 14px',textTransform:'uppercase',letterSpacing:'0.8px'}}>📣 Origem dos Leads</h3>
        {origArr.length===0?<p style={{color:C.tx3,fontSize:'13px'}}>Nenhum dado disponível ainda.</p>:origArr.map(([origem,cnt],i)=>{const pct=totLd>0?Math.round(cnt/totLd*100):0;return<div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.brd}`,fontSize:'13px'}}>
          <span style={{color:C.txt,fontWeight:'500'}}>{origem}</span>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}><span style={{color:C.tx2}}>{cnt}</span><Bdg c="neu">{pct}%</Bdg></div>
        </div>;})}
      </div>
    </div>
  </div>;
}

// ─── MAIN APP ───
function App(){
  const [tab,setTab]=useState('dashboard');
  const [agenda,setAgenda]=useCRUD('agenda',[]);
  const [clientes,setClientes]=useCRUD('clientes',[]);
  const [fin,setFin]=useCRUD('fin',[]);
  const [est,setEst]=useCRUD('est',DEF_EST);
  const [leads,setLeads]=useCRUD('leads',[]);
  const [sinais,setSinais]=useCRUD('sinais',[]);
  const [cic,setCic]=useCRUD('cic',[]);
  const [comCfg,setComCfg]=useCRUD('comcfg',DEF_COM);
  const [comLanc,setComLanc]=useCRUD('comlanc',[]);
  const [contr,setContr]=useCRUD('contr',[]);
  const [mkt,setMkt]=useCRUD('mkt',[]);
  const [prec,setPrec]=useCRUD('prec',DEF_PREC);
  const [metas,setMetasRaw]=useState(()=>{try{const v=localStorage.getItem('ct_metas');return v?JSON.parse(v):DEF_META;}catch(e){return DEF_META;}});
  const setMetas=v=>{const n=typeof v==='function'?v(metas):v;setMetasRaw(n);try{localStorage.setItem('ct_metas',JSON.stringify(n));}catch(e){}};

  const kpis=useMemo(()=>{
    const rec=fin.filter(f=>f.tipo==='Receita').reduce((s,f)=>s+parseFloat(f.valor||0),0);
    const desp=fin.filter(f=>f.tipo==='Despesa').reduce((s,f)=>s+parseFloat(f.valor||0),0);
    const luc=rec-desp;const marg=rec>0?((luc/rec)*100).toFixed(1):0;
    const ses=agenda.filter(a=>a.status==='Concluído').length;
    const cli=clientes.length;
    const tick=ses>0?(rec/ses).toFixed(0):0;
    const canc=agenda.filter(a=>a.status==='Cancelado').length;
    const fid=clientes.filter(c=>c.status==='Fidelizado'||c.status==='VIP').length;
    const valEst=est.reduce((s,e)=>s+(parseFloat(e.custo||0)*parseFloat(e.qtd||0)),0);
    return{rec,desp,luc,marg,ses,cli,tick,canc,fid,valEst};
  },[fin,agenda,clientes,est]);

  const TABS=[
    {id:'dashboard',l:'📊 Dashboard'},{id:'agenda',l:'📅 Agenda'},{id:'clientes',l:'👥 Clientes'},
    {id:'followup',l:'🔔 Follow-Up'},{id:'financeiro',l:'💰 Financeiro'},{id:'calculadora',l:'🧮 Calculadora'},
    {id:'estoque',l:'📦 Estoque'},{id:'leads',l:'🎯 Leads'},{id:'metas',l:'📈 Metas'},
    {id:'sinais',l:'💎 Sinais'},{id:'cicatrizacao',l:'🌿 Cicatrização'},{id:'comissoes',l:'💼 Comissões'},
    {id:'contratos',l:'📋 Contratos'},{id:'precos',l:'🏷️ Preços'},{id:'marketing',l:'📱 Marketing'},
    {id:'relatorio',l:'📊 Relatório'},
  ];

  const render=()=>{
    switch(tab){
      case 'dashboard': return <Dashboard kpis={kpis} agenda={agenda} metas={metas}/>;
      case 'agenda': return <Agenda agenda={agenda} setAgenda={setAgenda}/>;
      case 'clientes': return <Clientes clientes={clientes} setClientes={setClientes}/>;
      case 'followup': return <FollowUp clientes={clientes} agenda={agenda}/>;
      case 'financeiro': return <Financeiro fin={fin} setFin={setFin} kpis={kpis}/>;
      case 'calculadora': return <Calculadora/>;
      case 'estoque': return <Estoque est={est} setEst={setEst}/>;
      case 'leads': return <Leads leads={leads} setLeads={setLeads}/>;
      case 'metas': return <Metas metas={metas} setMetas={setMetas}/>;
      case 'sinais': return <Sinais sinais={sinais} setSinais={setSinais}/>;
      case 'cicatrizacao': return <Cicatrizacao cic={cic} setCic={setCic}/>;
      case 'comissoes': return <Comissoes comCfg={comCfg} setComCfg={setComCfg} comLanc={comLanc} setComLanc={setComLanc}/>;
      case 'contratos': return <Contratos contr={contr} setContr={setContr}/>;
      case 'precos': return <Precos prec={prec} setPrec={setPrec}/>;
      case 'marketing': return <Marketing mkt={mkt} setMkt={setMkt}/>;
      case 'relatorio': return <Relatorio kpis={kpis} fin={fin} leads={leads} agenda={agenda}/>;
      default: return null;
    }
  };

  return <div style={{minHeight:'100vh',background:C.bg}}>
    {/* HEADER */}
    <div style={{background:C.acc,color:'#FFF',padding:'13px 28px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100}}>
      <div style={{display:'flex',alignItems:'center',gap:'16px'}}>
        <div>
          <span style={{fontSize:'20px',fontFamily:'Playfair Display,Georgia,serif',fontWeight:'700',letterSpacing:'2px',textTransform:'uppercase'}}>Central Tattoo</span>
          <span style={{fontSize:'11px',opacity:0.6,marginLeft:'14px',letterSpacing:'2px',textTransform:'uppercase'}}>Sistema de Gestão Premium</span>
        </div>
      </div>
      <div style={{fontSize:'11px',opacity:0.5,letterSpacing:'1px'}}>Versão 2026 · Dados salvos automaticamente</div>
    </div>
    {/* NAV TABS */}
    <div style={{background:C.nav,borderBottom:`1px solid ${C.brd}`,overflowX:'auto',whiteSpace:'nowrap',position:'sticky',top:'49px',zIndex:99}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{display:'inline-block',padding:'13px 15px',background:'transparent',border:'none',borderBottom:`3px solid ${tab===t.id?C.acc:'transparent'}`,color:tab===t.id?C.acc:C.tx2,cursor:'pointer',fontSize:'12px',fontFamily:'inherit',fontWeight:tab===t.id?'700':'400',letterSpacing:'0.2px',transition:'all 0.15s',whiteSpace:'nowrap'}}>{t.l}</button>)}
    </div>
    {/* CONTENT */}
    <div style={{padding:'28px',maxWidth:'1400px',margin:'0 auto'}}>
      {render()}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
