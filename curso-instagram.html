@media(max-width:900px){.sidebar{width:260px;transform:translateX(-100%);transition:transform .3s;}.sidebar.open{transform:translateX(0);}.main{margin-left:0;}.aula-wrap{padding:20px 16px;}.main-header{padding:12px 16px;}}

  {mod:'MÓDULO 1 — FUNDAÇÃO DO PERFIL', aulas:[
    {t:'Boas-vindas ao curso', c:`
<div class="aula-tag">Módulo 1 · Aula 1</div>
<h1 class="aula-h1">Boas-vindas ao <span>Instagram para Tatuadores</span></h1>
<p class="aula-intro">Você está prestes a transformar seu Instagram de um simples portfólio para uma máquina de atrair clientes todo dia. Esse curso foi criado com base em mais de 7 anos de experiência no mercado tattoo de BH e nas estratégias que realmente funcionam em 2026.</p>
<h2 class="ah2">O que você vai aprender</h2>
<ul class="checklist">
  <li>Como configurar seu perfil profissional do zero</li>
  <li>A estratégia de conteúdo que atrai clientes (não apenas seguidores)</li>
  <li>Como criar Reels que viralizam e geram agendamentos</li>
  <li>Stories estratégicos que vendem todos os dias</li>
  <li>Como usar SEO do Instagram para aparecer nas buscas</li>
  <li>Hashtags que funcionam de verdade em 2026</li>
  <li>Análise de métricas para tomar decisões certas</li>
</ul>
<div class="destaque"><p><strong>Importante:</strong> Esse curso é 100% prático. Cada aula tem passos específicos para você executar. Não é teoria — é o que funciona no dia a dia de um estúdio real.</p></div>
<h2 class="ah2">Como aproveitar ao máximo</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Execute cada aula antes de avançar</h4><p>Não adianta consumir o conteúdo sem aplicar. Após cada aula, execute o que foi ensinado no seu perfil.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Tenha seu celular ao lado</h4><p>A maioria das ações será feita pelo aplicativo do Instagram. Deixe o app aberto enquanto assiste.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Marque as aulas como concluídas</h4><p>Use o botão "Concluir" para acompanhar seu progresso e o sistema salvar onde você parou.</p></div></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)" disabled>← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima aula →</button></div>`},
    {t:'Configurando o perfil comercial', c:`
<div class="aula-tag">Módulo 1 · Aula 2</div>
<h1 class="aula-h1">Configurando o <span>Perfil Comercial</span></h1>
<p class="aula-intro">Antes de postar qualquer conteúdo, seu perfil precisa estar configurado para converter. Um perfil mal configurado desperdiça todo o esforço de criação de conteúdo.</p>
<h2 class="ah2">Passo 1 — Trocar para conta profissional</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Abra o Instagram no celular</h4><p>Toque no ícone do Instagram. Certifique-se de estar logado na conta certa.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Acesse seu perfil</h4><p>Toque no ícone do seu perfil no canto inferior direito da tela.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Abra as configurações</h4><p>Toque nas <strong>3 linhas horizontais</strong> (≡) no canto superior direito → toque em <code>Configurações e privacidade</code>.</p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Acesse "Tipo de conta"</h4><p>Role a tela → toque em <code>Tipo de conta e ferramentas</code> → toque em <code>Mudar para conta profissional</code>.</p></div></div>
<div class="passo"><div class="passo-n">5</div><div class="passo-body"><h4>Selecione a categoria</h4><p>O Instagram vai pedir que você escolha uma categoria. Digite <code>Tatuagem e Piercing</code> na busca → selecione → toque em <code>Avançar</code>.</p></div></div>
<div class="passo"><div class="passo-n">6</div><div class="passo-body"><h4>Escolha "Empresa" (não Criador)</h4><p>Selecione <code>Empresa</code> → toque em <code>Avançar</code> → pule as etapas opcionais → toque em <code>Concluído</code>.</p></div></div>
<div class="dica"><p>✅ <strong>Dica:</strong> A conta Empresa dá acesso a mais dados de análise, botão de contato direto e possibilidade de agendar posts pelo Meta Business Suite.</p></div>
<h2 class="ah2">Passo 2 — Foto de perfil profissional</h2>
<p class="ap">A foto de perfil é a primeira coisa que o cliente vê. Ela precisa transmitir profissionalismo e identidade.</p>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Use sua logo OU sua foto profissional</h4><p>Se você tem uma logo bem feita → use a logo. Se não tem → use uma foto sua em ambiente de trabalho com boa iluminação. <strong>Nunca use foto com fundo bagunçado.</strong></p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Tamanho correto</h4><p>A foto de perfil aparece em círculo de <code>110x110px</code> no mobile. Salve sua imagem em <code>400x400px</code> para garantir qualidade. Evite textos pequenos que ficam ilegíveis.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Como trocar no app</h4><p>Vá ao seu perfil → toque em <code>Editar perfil</code> → toque em <code>Foto ou avatar do perfil</code> → selecione a imagem da galeria → centralize → salve.</p></div></div>
<h2 class="ah2">Passo 3 — Nome de usuário otimizado</h2>
<p class="ap">Seu @username precisa ser fácil de encontrar e lembrar. Siga essas regras:</p>
<ul class="checklist">
  <li>Use seu nome + "tattoo" + cidade: <code>@nometattoo.bh</code> ou <code>@nome_tattoo_bh</code></li>
  <li>Sem números aleatórios: <code>@tatuador1234</code> parece amador</li>
  <li>Sem pontos excessivos: <code>@nome.tattoo.bh.oficial</code> é difícil de digitar</li>
  <li>Máximo de 20 caracteres para caber completo nas buscas</li>
</ul>
<div class="alerta"><p>⚠️ <strong>Atenção:</strong> Mudar de username frequentemente faz você perder posicionamento nas buscas do Instagram. Escolha bem e mantenha.</p></div>
<h2 class="ah2">Passo 4 — Nome de exibição (SEO do Instagram)</h2>
<p class="ap">O nome de exibição (não o @) é indexado pelo algoritmo de busca. É diferente do username.</p>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Acesse Editar perfil</h4><p>Vá ao perfil → toque <code>Editar perfil</code>.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Preencha o campo "Nome"</h4><p>Coloque: <code>Seu Nome | Tatuador BH</code> ou <code>Estúdio de Tatuagem BH | Sua Cidade</code>. Esse campo aparece nas buscas quando alguém digita "tatuador BH" no Instagram.</p></div></div>
<div class="destaque"><p><strong>Exemplo real:</strong> Nome: <code>Carlos Tattoo BH | Realismo e Cover Up</code> — quando alguém busca "tatuagem realismo BH" no Instagram, esse perfil aparece.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima aula →</button></div>`},
    {t:'Bio que converte em agendamentos', c:`
<div class="aula-tag">Módulo 1 · Aula 3</div>
<h1 class="aula-h1">Bio que <span>Converte em Agendamentos</span></h1>
<p class="aula-intro">Você tem 150 caracteres na bio para convencer um desconhecido a te contatar. Essa é sua vitrine. A maioria dos tatuadores desperdiça esse espaço com frases genéricas que não convertem.</p>
<h2 class="ah2">A fórmula da bio que converte</h2>
<div class="destaque"><p><strong>Estrutura:</strong><br>Linha 1: O que você faz + especialidade<br>Linha 2: Prova social (número de trabalhos, anos de exp, estrelas)<br>Linha 3: Localização<br>Linha 4: CTA (call to action) com link</p></div>
<div class="exemplo"><div class="exemplo-label">Exemplo real</div><p>🖤 Realismo & Cover Up em BH<br>2.400+ tatuagens · 7 anos · ⭐5.0 Google<br>📍 Mantiqueira, Belo Horizonte<br>👇 Agende sua consulta gratuita</p></div>
<h2 class="ah2">Como editar sua bio</h2>
<div class="passo"><div class="passo-n">1</div><div class="passo-body"><h4>Acesse "Editar perfil"</h4><p>Perfil → <code>Editar perfil</code> → campo <code>Bio</code>.</p></div></div>
<div class="passo"><div class="passo-n">2</div><div class="passo-body"><h4>Para quebrar linha na bio</h4><p>No iPhone: pressione <code>Return</code>. No Android: pressione <code>Enter</code>. Se não funcionar, escreva a bio no bloco de notas e copie.</p></div></div>
<div class="passo"><div class="passo-n">3</div><div class="passo-body"><h4>Configure o link na bio</h4><p>Use o campo <code>Website</code> ou <code>Link na bio</code> para colocar o link do seu site ou um link do WhatsApp:<br><code>https://wa.me/5531983391576?text=Quero+agendar</code></p></div></div>
<div class="passo"><div class="passo-n">4</div><div class="passo-body"><h4>Botão de contato</h4><p>Como conta empresa: <code>Editar perfil</code> → <code>Opções de contato</code> → adicione seu número de WhatsApp. Um botão "Ligar" ou "Email" aparece no perfil.</p></div></div>
<h2 class="ah2">Destaques — os 5 obrigatórios</h2>
<p class="ap">Os destaques ficam logo abaixo da bio e são a segunda coisa que o cliente vê. Crie esses 5:</p>
<ul class="checklist">
  <li><strong>Portfólio</strong> — seus melhores trabalhos por estilo</li>
  <li><strong>Processo</strong> — vídeos do processo de tatuar (gera autoridade)</li>
  <li><strong>Depoimentos</strong> — prints de mensagens e avaliações positivas</li>
  <li><strong>Preços</strong> — tabela de preços ou como funciona o orçamento</li>
  <li><strong>Sobre mim</strong> — sua história, sua técnica, seu estúdio</li>
</ul>
<div class="dica"><p>✅ <strong>Dica de capa dos destaques:</strong> Use capas com fundo preto e ícone dourado/branco. Mantém a identidade visual e parece muito mais profissional do que capas aleatórias.</p></div>
<div class="aula-nav-bottom"><button class="btn-ant-b" onclick="navAula(-1)">← Anterior</button><button class="btn-prox-b" onclick="navAula(1)">Próxima aula →</button></div>`}
  ]},

    {t:'Os 4 tipos de conteúdo que vendem', c:`
<div class="aula-tag">Módulo 2 · Aula 4</div>
<h1 class="aula-h1">Os 4 tipos de conteúdo <span>que vendem</span></h1>
<p class="aula-intro">Não é sobre postar mais — é sobre postar certo. Tatuadores que lotam agenda não postam todo dia aleatoriamente. Eles seguem um sistema com 4 tipos de conteúdo que trabalham juntos para atrair, engajar e converter.</p>
<h2 class="ah2">Tipo 1 — Conteúdo de Portfólio (40% do feed)</h2>
<p class="ap">Mostra o seu trabalho. É a prova de que você é bom. Sem isso, não existe confiança.</p>
<ul class="checklist">
  <li>Foto do trabalho finalizado com boa iluminação</li>
  <li>Vídeo do processo + resultado final em Reel</li>
  <li>Antes e depois (funciona muito bem para cover up)</li>
  <li>Zoom em detalhes técnicos difíceis (sombra, textura, olhos realistas)</li>
</ul>
<div class="exemplo"><div class="exemplo-label">Legenda modelo — portfólio</div><p>"Retrato realista no braço. 4h de sessão, tinta Eternal Ink importada. Cada detalhe foi desenhado especificamente para esse cliente. 🖤 Agende sua consulta gratuita — link na bio."</p></div>

// ── LÓGICA DO CURSO ──
function totalAulas(){return MODULOS.reduce((s,m)=>s+m.aulas.length,0);}

function getAula(idx){
  let n=0;
  for(const m of MODULOS){
    for(const a of m.aulas){
      if(n===idx) return {...a,mod:m.mod};
      n++;
    }
  }
  return null;
}

function renderSidebar(){
  const c=document.getElementById('sbModulos');
  c.innerHTML='';
  let n=0;
  MODULOS.forEach(mod=>{
    const div=document.createElement('div');
    const mt=document.createElement('div');
    mt.className='sb-mod-titulo';
    mt.textContent=mod.mod;
    div.appendChild(mt);
    mod.aulas.forEach((a,ai)=>{
      const idx=n;
      const done=(prog['done_'+CURSO_ID]||[]).includes(idx);
      const li=document.createElement('div');
      li.className='sb-aula'+(idx===aulaAtual?' active':'')+(done?' done':'');
      li.innerHTML=`<span class="sb-aula-num">${String(idx+1).padStart(2,'0')}</span><span class="sb-aula-nome">${a.t}</span>${done?'<span class="sb-aula-check">✓</span>':''}`;
      li.onclick=()=>irAula(idx);
      div.appendChild(li);
      n++;
    });
    c.appendChild(div);
  });
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  const pct=Math.round((done/total)*100);
  document.getElementById('progressoPct').textContent=pct+'%';
  document.getElementById('progressoFill').style.width=pct+'%';
}

function renderAula(){
  const a=getAula(aulaAtual);
  if(!a) return;
  document.getElementById('mhTitulo').textContent=a.t;
  document.getElementById('aulaContent').innerHTML=a.c;
  document.getElementById('btnAnt').disabled=aulaAtual===0;
  document.getElementById('btnProx').disabled=aulaAtual>=totalAulas()-1;
  window.scrollTo(0,0);
}

function irAula(idx){
  aulaAtual=idx;
  prog['aula_'+CURSO_ID]=idx;
  salvar();
  renderSidebar();
  renderAula();
}

function navAula(dir){
  const n=aulaAtual+dir;
  if(n>=0&&n<totalAulas()) irAula(n);
}

function concluirAula(){
  if(!prog['done_'+CURSO_ID]) prog['done_'+CURSO_ID]=[];
  if(!prog['done_'+CURSO_ID].includes(aulaAtual)) prog['done_'+CURSO_ID].push(aulaAtual);
  salvar();
  renderSidebar();
  if(aulaAtual<totalAulas()-1) navAula(1);
  else{alert('🎉 Parabéns! Você concluiu o curso Instagram para Tatuadores!');}
}

function salvar(){
  const total=totalAulas();
  const done=(prog['done_'+CURSO_ID]||[]).length;
  prog[CURSO_ID]=Math.round((done/total)*100);
  localStorage.setItem('ct_progresso_'+(sessao?.email||''),JSON.stringify(prog));
}

renderSidebar();
renderAula();
</script>
</body>
</html>
