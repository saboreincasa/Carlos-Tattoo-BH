<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitor de Ebook — Carlos Tattoo BH</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0d0a04;--d1:#1C1208;--d2:#2A1A08;--g1:#E8B800;--g2:#C9A84C;--g3:#A07830;--t1:#EDE4D4;--t2:#C9B89A;--t3:#9A7A5A;}
body{font-family:'Raleway',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;}
/* PROTEÇÕES */
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;}
/* HEADER */
.reader-header{background:rgba(28,18,8,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,.1);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;flex-shrink:0;}
.rh-left{display:flex;align-items:center;gap:16px;}
.rh-back{background:none;border:none;color:var(--g2);cursor:pointer;font-size:18px;transition:.2s;padding:8px;}
.rh-back:hover{color:var(--g1);}
.rh-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:var(--t2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rh-right{display:flex;align-items:center;gap:12px;}
.rh-progress{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;color:rgba(201,168,76,.5);}
/* WATERMARK */
.watermark-reader{position:fixed;inset:0;pointer-events:none;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:.025;transform:rotate(-20deg);font-family:'Cinzel',serif;font-size:clamp(14px,2vw,22px);letter-spacing:4px;color:rgba(201,168,76,1);white-space:nowrap;text-align:center;}
/* LAYOUT */
.reader-layout{display:flex;flex:1;overflow:hidden;}
/* SIDEBAR */
.reader-sidebar{width:260px;background:rgba(28,18,8,.8);border-right:1px solid rgba(201,168,76,.08);overflow-y:auto;flex-shrink:0;padding:20px 0;}
.sidebar-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.4);text-transform:uppercase;padding:0 20px 16px;border-bottom:1px solid rgba(201,168,76,.06);}
.chapter-list{list-style:none;padding:12px 0;}
.chapter-item{padding:12px 20px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;}
.chapter-item:hover{background:rgba(201,168,76,.05);border-left-color:rgba(201,168,76,.3);}
.chapter-item.active{background:rgba(201,168,76,.08);border-left-color:var(--g2);}
.chapter-item.done{opacity:.6;}
.chapter-n{font-family:'Cinzel Decorative',cursive;font-size:11px;color:var(--g2);min-width:22px;}
.chapter-name{font-size:12px;color:var(--t2);line-height:1.4;flex:1;}
.chapter-check{font-size:12px;color:var(--g2);flex-shrink:0;}
/* CONTENT */
.reader-content{flex:1;overflow-y:auto;position:relative;}
.reader-content-inner{max-width:760px;margin:0 auto;padding:40px 40px 100px;}
/* IFRAME DO EBOOK */
.ebook-frame-wrap{width:100%;}
.ebook-frame{width:100%;min-height:calc(100vh - 200px);border:none;background:#fff;border-radius:12px;overflow:hidden;}
/* BARRA DE PROGRESSO */
.progress-bar-top{height:3px;background:linear-gradient(90deg,var(--g3),var(--g1));position:fixed;top:56px;left:0;z-index:99;transition:width .3s;}
/* CONTROLES */
.reader-controls{position:fixed;bottom:0;left:0;right:0;background:rgba(10,7,2,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(201,168,76,.1);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.rc-progress{flex:1;display:flex;align-items:center;gap:12px;}
.rc-bar{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.rc-bar-fill{height:100%;background:linear-gradient(90deg,var(--g3),var(--g1));transition:width .3s;}
.rc-text{font-family:'Cinzel',serif;font-size:10px;color:rgba(201,168,76,.5);white-space:nowrap;}
.btn-nav{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--g2);padding:8px 20px;border-radius:8px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;cursor:pointer;transition:.2s;}
.btn-nav:hover{background:rgba(201,168,76,.2);}
.btn-nav:disabled{opacity:.3;cursor:not-allowed;}
/* AVISO PRINT */
.print-warning{display:none;position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:99999;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.print-warning.show{display:flex;}
.print-warning p{font-family:'Cinzel Decorative',cursive;font-size:24px;color:#E8B800;text-align:center;}
.print-warning small{font-size:14px;color:rgba(237,228,212,.6);text-align:center;}
/* MOBILE SIDEBAR */
.sidebar-toggle{display:none;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--g2);padding:8px 12px;border-radius:8px;font-size:14px;cursor:pointer;}
@media(max-width:768px){
  .reader-sidebar{position:fixed;left:-260px;top:56px;bottom:0;z-index:50;transition:left .3s;}
  .reader-sidebar.open{left:0;}
  .sidebar-toggle{display:block;}
  .reader-content-inner{padding:20px 16px 100px;}
}
</style>
</head>
<body>

<!-- PROTEÇÕES -->
<div class="watermark-reader" id="wmReader">Carlos Tattoo BH</div>
<div class="print-warning" id="printWarn">
  <p>⚠️ Conteúdo Protegido</p>
  <small>Este material é de uso exclusivo do comprador.<br>Compartilhar é uma violação dos termos de uso.</small>
</div>

<!-- PROGRESS BAR TOP -->
<div class="progress-bar-top" id="progressTop" style="width:0%"></div>

<!-- HEADER -->
<header class="reader-header">
  <div class="rh-left">
    <button class="rh-back" onclick="window.location.href='painel.html'" title="Voltar ao painel">←</button>
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Capítulos">☰</button>
    <span class="rh-title" id="readerTitle">Carregando...</span>
  </div>
  <div class="rh-right">
    <span class="rh-progress" id="readerProgress">0%</span>
  </div>
</header>

<!-- LAYOUT -->
<div class="reader-layout">

  <!-- SIDEBAR CAPÍTULOS -->
  <aside class="reader-sidebar" id="readerSidebar">
    <div class="sidebar-title">Capítulos</div>
    <ul class="chapter-list" id="chapterList">
      <!-- Preenchido via JS -->
    </ul>
  </aside>

  <!-- CONTEÚDO -->
  <div class="reader-content" id="readerContent">
    <div class="reader-content-inner">
      <div id="ebookContent">
        <!-- Ebook carregado aqui via fetch -->
        <div style="text-align:center;padding:60px;"><p style="color:rgba(201,168,76,.5);font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;">Carregando conteúdo...</p></div>
      </div>
    </div>
  </div>

</div>

<!-- CONTROLES INFERIORES -->
<div class="reader-controls">
  <button class="btn-nav" id="btnAnterior" onclick="navCapitulo(-1)" disabled>← Anterior</button>
  <div class="rc-progress">
    <div class="rc-bar"><div class="rc-bar-fill" id="rcBarFill" style="width:0%"></div></div>
    <span class="rc-text" id="rcText">Cap. 0 de 0</span>
  </div>
  <button class="btn-nav" id="btnProximo" onclick="navCapitulo(1)">Próximo →</button>
</div>

<script>
// ── PROTEÇÕES ──
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&['c','s','p','a','u'].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key==='F12'||e.key==='PrintScreen'){e.preventDefault();mostrarAvisoProtecao();}
});
document.addEventListener('copy',e=>e.preventDefault());
window.addEventListener('beforeprint',()=>{mostrarAvisoProtecao();});

function mostrarAvisoProtecao(){
  document.getElementById('printWarn').classList.add('show');
  setTimeout(()=>document.getElementById('printWarn').classList.remove('show'),3000);
}

// ── VERIFICAR SESSÃO ──
const sessaoRaw=sessionStorage.getItem('ct_sessao');
if(!sessaoRaw){window.location.href='acesso.html';}
const sessao=JSON.parse(sessaoRaw||'{}');

// ── WATERMARK COM NOME ──
const usuarios=JSON.parse(localStorage.getItem('ct_usuarios')||'[]');
const user=usuarios.find(u=>u.email.toLowerCase()===sessao.email.toLowerCase());
if(!user){sessionStorage.clear();window.location.href='acesso.html';}

document.getElementById('wmReader').textContent=`${user.nome||user.email} · Carlos Tattoo BH · Uso exclusivo do comprador`;

// ── MAPEAR EBOOK ──
const params=new URLSearchParams(location.search);
const ebookId=params.get('id')||'ebook-trafego';

// Verificar se usuário tem acesso
const produtos=user.produtos||[];
if(!produtos.includes(ebookId)){
  alert('Você não tem acesso a este conteúdo.');
  window.location.href='painel.html';
}

const EBOOKS_MAP={
  'ebook-trafego':{
    titulo:'Tráfego Tattoo do Zero',
    capitulos:[
      {nome:'Módulo 1 — Fundamentos',arquivo:'ebook-trafego-iniciante.html',ancora:'mod1'},
      {nome:'Módulo 2 — Meta Ads na Prática',arquivo:'ebook-trafego-iniciante.html',ancora:'mod2'},
      {nome:'Módulo 3 — Criativos e Textos',arquivo:'ebook-trafego-iniciante.html',ancora:'mod3'},
      {nome:'Módulo 4 — Públicos Avançados',arquivo:'ebook-trafego-iniciante.html',ancora:'mod4'},
      {nome:'Módulo 5 — Orçamento e Escalagem',arquivo:'ebook-trafego-iniciante.html',ancora:'mod5'},
      {nome:'Módulo 6 — Análise e Otimização',arquivo:'ebook-trafego-iniciante.html',ancora:'mod6'},
      {nome:'Módulo 7 — Atendimento e Conversão',arquivo:'ebook-trafego-iniciante.html',ancora:'mod7'},
      {nome:'Módulo 8 — Erros e Checklist',arquivo:'ebook-trafego-iniciante.html',ancora:'mod8'},
    ]
  },
  'ebook-instagram':{
    titulo:'Instagram que Atrai e Vende',
    capitulos:[
      {nome:'Módulo 1 — Fundação do Perfil',arquivo:'ebook-instagram-tattoo.html',ancora:'mod1'},
      {nome:'Módulo 2 — Estratégia de Conteúdo',arquivo:'ebook-instagram-tattoo.html',ancora:'mod2'},
      {nome:'Módulo 3 — Reels que Viralizam',arquivo:'ebook-instagram-tattoo.html',ancora:'mod3'},
      {nome:'Módulo 4 — Stories que Vendem',arquivo:'ebook-instagram-tattoo.html',ancora:'mod4'},
      {nome:'Módulo 5 — SEO e Hashtags',arquivo:'ebook-instagram-tattoo.html',ancora:'mod5'},
      {nome:'Módulo 6 — Conversão e Análise',arquivo:'ebook-instagram-tattoo.html',ancora:'mod6'},
      {nome:'Módulo 7 — Crescimento Acelerado',arquivo:'ebook-instagram-tattoo.html',ancora:'mod7'},
    ]
  },
  'ebook-posicionamento':{
    titulo:'Posicionamento de Alta Valor',
    capitulos:[
      {nome:'Módulo 1 — Mentalidade Premium',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod1'},
      {nome:'Módulo 2 — Precificação Estratégica',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod2'},
      {nome:'Módulo 3 — Scripts VIP de Atendimento',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod3'},
      {nome:'Módulo 4 — Branding Premium',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod4'},
      {nome:'Módulo 5 — Funil de Vendas',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod5'},
      {nome:'Módulo 6 — Gestão e Expansão',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod6'},
      {nome:'Módulo 7 — Plano 90 Dias',arquivo:'ebook-posicionamento-avancado.html',ancora:'mod7'},
    ]
  },
  'ebook-templates':{titulo:'Pack Templates Premium',capitulos:[{nome:'Guia de uso do Canva',arquivo:'ebook-pack-templates.html',ancora:''},{nome:'Templates de Stories',arquivo:'ebook-pack-templates.html',ancora:''},{nome:'Templates de Feed',arquivo:'ebook-pack-templates.html',ancora:''},{nome:'Templates de Anúncios',arquivo:'ebook-pack-templates.html',ancora:''}]},
  'ebook-contrato':{titulo:'Contrato Digital Profissional',capitulos:[{nome:'Como usar o contrato',arquivo:'ebook-contrato-digital.html',ancora:''},{nome:'Contrato completo',arquivo:'ebook-contrato-digital.html',ancora:''},{nome:'Versão WhatsApp',arquivo:'ebook-contrato-digital.html',ancora:''}]},
};

const ebook=EBOOKS_MAP[ebookId]||EBOOKS_MAP['ebook-trafego'];
document.title=ebook.titulo+' — Carlos Tattoo BH';
document.getElementById('readerTitle').textContent=ebook.titulo;

// ── CAPÍTULOS ──
let capAtual=0;
const progresso=JSON.parse(localStorage.getItem('ct_progresso_'+user.email)||'{}');
capAtual=progresso['cap_'+ebookId]||0;

const chapterList=document.getElementById('chapterList');
ebook.capitulos.forEach((cap,i)=>{
  const li=document.createElement('li');
  li.className='chapter-item'+(i===capAtual?' active':'')+(i<capAtual?' done':'');
  li.innerHTML=`<span class="chapter-n">${String(i+1).padStart(2,'0')}</span><span class="chapter-name">${cap.nome}</span>${i<capAtual?'<span class="chapter-check">✓</span>':''}`;
  li.onclick=()=>irCapitulo(i);
  chapterList.appendChild(li);
});

function atualizarUI(){
  const pct=Math.round(((capAtual+1)/ebook.capitulos.length)*100);
  document.getElementById('readerProgress').textContent=pct+'%';
  document.getElementById('progressTop').style.width=pct+'%';
  document.getElementById('rcBarFill').style.width=pct+'%';
  document.getElementById('rcText').textContent=`Cap. ${capAtual+1} de ${ebook.capitulos.length}`;
  document.getElementById('btnAnterior').disabled=capAtual===0;
  document.getElementById('btnProximo').disabled=capAtual===ebook.capitulos.length-1;
  // Atualizar sidebar
  document.querySelectorAll('.chapter-item').forEach((el,i)=>{
    el.classList.toggle('active',i===capAtual);
    el.classList.toggle('done',i<capAtual);
  });
  // Salvar progresso
  const p=JSON.parse(localStorage.getItem('ct_progresso_'+user.email)||'{}');
  p['cap_'+ebookId]=capAtual;
  p[ebookId]=pct;
  localStorage.setItem('ct_progresso_'+user.email,JSON.stringify(p));
}

function carregarCapitulo(){
  const cap=ebook.capitulos[capAtual];
  // Mostrar o ebook no iframe embutido
  const content=document.getElementById('ebookContent');
  content.innerHTML=`<iframe src="${cap.arquivo}${cap.ancora?'#'+cap.ancora:''}" class="ebook-frame" id="ebookFrame" onload="frameCarregado()" sandbox="allow-same-origin allow-scripts"></iframe>`;
  atualizarUI();
  document.getElementById('readerContent').scrollTop=0;
}

function frameCarregado(){
  const frame=document.getElementById('ebookFrame');
  try{
    // Proteções dentro do iframe
    const fd=frame.contentDocument||frame.contentWindow.document;
    if(fd){
      fd.addEventListener('contextmenu',e=>e.preventDefault());
      fd.addEventListener('copy',e=>e.preventDefault());
      // Remover botão de impressão
      const btns=fd.querySelectorAll('.btn-print,.no-print');
      btns.forEach(b=>b.style.display='none');
    }
  }catch(e){}
}

function irCapitulo(i){
  capAtual=i;
  carregarCapitulo();
  if(window.innerWidth<=768)toggleSidebar();
}

function navCapitulo(dir){
  const novo=capAtual+dir;
  if(novo>=0&&novo<ebook.capitulos.length){capAtual=novo;carregarCapitulo();}
}

function toggleSidebar(){
  document.getElementById('readerSidebar').classList.toggle('open');
}

// Iniciar
carregarCapitulo();
</script>
</body>
</html>
